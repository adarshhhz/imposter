<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>City Bus Simulator</title>
<style>
  :root {
    --accent: #FF9F0A;
    --accent-dark: #CC7E00;
    --panel: rgba(18, 18, 24, 0.78);
    --panel-light: rgba(30, 30, 40, 0.85);
    --success: #32D74B;
    --danger: #FF453A;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0a0e14; font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; }
  canvas { display: block; touch-action: none; }

  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
  .hud-top { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .pill { background: var(--panel); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); border-radius: 14px; padding: 8px 14px; color: #fff; font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 6px; box-shadow: 0 4px 16px rgba(0,0,0,0.35); pointer-events: auto; }
  .pill .lbl { font-weight: 400; color: #9a9aab; font-size: 11px; }
  #money { color: var(--success); }
  #camBtn { cursor: pointer; }
  #camBtn:active { transform: scale(0.94); }

  #speedWrap { position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); text-align: center; pointer-events: none; }
  #speedVal { font-size: 34px; font-weight: 900; color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,0.8); line-height: 1; }
  #speedUnit { font-size: 11px; color: #b5b5c5; letter-spacing: 1px; }

  #objective { position: absolute; top: 60px; left: 50%; transform: translateX(-50%); background: var(--panel); border: 1px solid rgba(255,159,10,0.4); border-radius: 12px; padding: 8px 16px; color: #fff; font-size: 13px; font-weight: 600; max-width: 86vw; text-align: center; box-shadow: 0 4px 16px rgba(0,0,0,0.35); }

  #stopPanel { position: absolute; bottom: 130px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--panel-light); border: 1px solid rgba(255,255,255,0.12); border-radius: 16px; padding: 14px 16px; min-width: 240px; text-align: center; opacity: 0; transition: all 0.25s ease; pointer-events: none; box-shadow: 0 8px 28px rgba(0,0,0,0.5); }
  #stopPanel.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
  #stopPanel h3 { margin: 0 0 8px; font-size: 15px; color: var(--accent); }
  .stopActionBtn { background: linear-gradient(180deg, #FFB020, var(--accent)); color: #1a1200; border: none; border-radius: 10px; padding: 10px 16px; font-weight: 700; font-size: 14px; margin: 4px; cursor: pointer; width: calc(100% - 8px); }
  .stopActionBtn:active { transform: scale(0.96); }
  .stopActionBtn.drop { background: linear-gradient(180deg, #4CE06A, var(--success)); color: #062b0c; }

  #toastLayer { position: absolute; top: 100px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; }
  .toast { background: rgba(20,20,26,0.9); border: 1px solid rgba(50,215,75,0.5); color: var(--success); font-weight: 800; padding: 6px 14px; border-radius: 20px; font-size: 15px; animation: floatUp 1.4s ease forwards; }
  @keyframes floatUp { 0% { opacity: 0; transform: translateY(10px) scale(0.8); } 15% { opacity: 1; transform: translateY(0) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-24px) scale(0.9); } }

  #minimapWrap { position: absolute; top: 60px; right: 12px; width: 92px; height: 92px; border-radius: 50%; overflow: hidden; border: 2px solid rgba(255,159,10,0.6); box-shadow: 0 4px 14px rgba(0,0,0,0.5); pointer-events: none; }
  #minimap { width: 100%; height: 100%; display: block; }

  #controls { position: absolute; bottom: 0; left: 0; right: 0; height: 150px; display: flex; justify-content: space-between; align-items: flex-end; padding: 0 14px 16px; pointer-events: none; }
  .ctrlGroup { display: flex; gap: 10px; pointer-events: auto; }
  .btnPad { width: 62px; height: 62px; border-radius: 50%; background: var(--panel-light); border: 1px solid rgba(255,255,255,0.14); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 26px; font-weight: 900; box-shadow: 0 4px 14px rgba(0,0,0,0.4); }
  .btnPad.active { background: var(--accent); color: #1a1200; border-color: var(--accent); }
  #brakeBtn.active { background: var(--danger); color: #fff; border-color: var(--danger); }
  #startOverlay { position: fixed; inset: 0; background: linear-gradient(rgba(6,8,12,0.75), rgba(6,8,12,0.92)), radial-gradient(circle at 50% 20%, #1c2230, #0a0e14); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; text-align: center; padding: 24px; }
  #startOverlay h1 { color: #fff; font-size: 30px; margin: 0 0 6px; letter-spacing: 1px; }
  #startOverlay p { color: #9a9aab; font-size: 14px; margin: 0 0 26px; max-width: 320px; line-height: 1.5; }
  #startBtn { background: linear-gradient(180deg, #FFB020, var(--accent)); color: #1a1200; border: none; padding: 16px 40px; border-radius: 14px; font-size: 17px; font-weight: 800; cursor: pointer; box-shadow: 0 8px 24px rgba(255,159,10,0.35); }
  #startBtn:active { transform: scale(0.97); }
  .legend { display: flex; gap: 14px; margin-top: 22px; flex-wrap: wrap; justify-content: center; }
  .legend div { color: #cfcfe0; font-size: 12px; display: flex; align-items: center; gap: 6px; }
  .swatch { width: 10px; height: 10px; border-radius: 3px; }
</style>
</head>
<body>

<div id="startOverlay">
  <h1>🚌 City Bus Simulator</h1>
  <p>Drive your route, pick up passengers at their stop, and drop them off where the same color marker is. Earn cash per passenger!</p>
  <button id="startBtn">Start Driving</button>
  <div class="legend">
    <div><span class="swatch" style="background:#FF5555"></span>Stop 1</div>
    <div><span class="swatch" style="background:#4FA8FF"></span>Stop 2</div>
    <div><span class="swatch" style="background:#4CE06A"></span>Stop 3</div>
    <div><span class="swatch" style="background:#FFD24C"></span>Stop 4</div>
    <div><span class="swatch" style="background:#C77DFF"></span>Stop 5</div>
  </div>
</div>

<div id="hud">
  <div class="hud-top">
    <div class="pill"><span class="lbl">$</span><span id="money">0</span></div>
    <div class="pill" id="camBtn">🎥 <span id="camLabel">3rd Person</span></div>
  </div>
  <div id="objective">Drive to a colored stop to pick up passengers</div>
  <div id="minimapWrap"><canvas id="minimap" width="180" height="180"></canvas></div>
  <div class="pill" style="position:absolute; top:106px; left:12px;">🧍 <span id="onboard">0</span>/<span id="capacity">8</span></div>
  <div id="toastLayer"></div>
  <div id="stopPanel"></div>
  <div id="speedWrap">
    <div id="speedVal">0</div>
    <div id="speedUnit">KM/H</div>
  </div>
  <div id="controls">
    <div class="ctrlGroup">
      <div class="btnPad" id="leftBtn">◀</div>
      <div class="btnPad" id="rightBtn">▶</div>
    </div>
    <div class="ctrlGroup">
      <div class="btnPad" id="brakeBtn">🛑</div>
      <div class="btnPad" id="gasBtn">▲</div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ================= CONFIG ================= */
const ROAD_OUTER = 42, ROAD_INNER = 30, ROAD_MID = (ROAD_OUTER + ROAD_INNER) / 2;
const STOP_COUNT = 5;
const STOP_COLORS = [0xFF5555, 0x4FA8FF, 0x4CE06A, 0xFFD24C, 0xC77DFF];
const CAPACITY = 8;
const MAX_SPEED = 16;        // m/s forward (~58 km/h)
const MAX_REVERSE = 4.5;
const ACCEL = 6.5, BRAKE_DECEL = 11, DRAG = 4.2, REVERSE_ACCEL = 3.5;
const TURN_RATE = 1.9;       // rad/s at full speed
const STEER_SIGN = 1;        // flip to -1 if steering feels inverted
const STOP_TRIGGER_RADIUS = 9;
const STOP_SPEED_THRESHOLD = 2.2;

/* ================= SAFE STORAGE ================= */
function safeGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function safeSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

/* ================= SCENE SETUP ================= */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8fc7ec);
scene.fog = new THREE.Fog(0x8fc7ec, 60, 170);

const camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 500);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* Lights */
const hemi = new THREE.HemisphereLight(0xffffff, 0x3a4a2f, 0.9);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff4dd, 1.1);
sun.position.set(60, 90, 30);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -80; sun.shadow.camera.right = 80;
sun.shadow.camera.top = 80; sun.shadow.camera.bottom = -80;
scene.add(sun);

/* Ground */
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(140, 48),
  new THREE.MeshStandardMaterial({ color: 0x4f8a3d })
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

/* Road ring */
const road = new THREE.Mesh(
  new THREE.RingGeometry(ROAD_INNER, ROAD_OUTER, 96),
  new THREE.MeshStandardMaterial({ color: 0x33343a })
);
road.rotation.x = -Math.PI/2;
road.position.y = 0.01;
road.receiveShadow = true;
scene.add(road);

/* Inner/outer curb rings */
[ROAD_INNER, ROAD_OUTER].forEach(r => {
  const curb = new THREE.Mesh(new THREE.RingGeometry(r-0.4, r, 96), new THREE.MeshStandardMaterial({ color: 0xd8d8d8 }));
  curb.rotation.x = -Math.PI/2; curb.position.y = 0.02;
  scene.add(curb);
});

/* Lane dashes (mid-ring) */
const dashGeo = new THREE.BoxGeometry(0.35, 0.02, 2.2);
const dashMat = new THREE.MeshStandardMaterial({ color: 0xffe27a, emissive: 0x332400 });
for (let i = 0; i < 64; i++) {
  const ang = (i/64) * Math.PI * 2;
  const dash = new THREE.Mesh(dashGeo, dashMat);
  dash.position.set(Math.sin(ang)*ROAD_MID, 0.03, Math.cos(ang)*ROAD_MID);
  dash.rotation.y = ang;
  scene.add(dash);
}

/* Decorative trees + buildings scattered outside ring */
function tree(x,z){
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.25,0.3,1.6,6), new THREE.MeshStandardMaterial({color:0x5b3a20}));
  trunk.position.y = 0.8; trunk.castShadow = true;
  const leaves = new THREE.Mesh(new THREE.ConeGeometry(1.5,3,7), new THREE.MeshStandardMaterial({color:0x2f7d3a}));
  leaves.position.y = 2.6; leaves.castShadow = true;
  g.add(trunk, leaves); g.position.set(x,0,z);
  scene.add(g);
}
function building(x,z,w,h,d,color){
  const b = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), new THREE.MeshStandardMaterial({color}));
  b.position.set(x,h/2,z); b.castShadow = true; b.receiveShadow = true;
  scene.add(b);
}
const buildingColors = [0xB0B7C6, 0xC9A27E, 0x9DB3A8, 0xD8C39A, 0xA8A0C8];
for (let i = 0; i < 26; i++) {
  const ang = Math.random()*Math.PI*2;
  const rad = ROAD_OUTER + 10 + Math.random()*30;
  const x = Math.sin(ang)*rad, z = Math.cos(ang)*rad;
  if (Math.random() < 0.55) tree(x,z);
  else building(x,z, 5+Math.random()*6, 6+Math.random()*14, 5+Math.random()*6, buildingColors[i%buildingColors.length]);
}
for (let i = 0; i < 40; i++) {
  const ang = Math.random()*Math.PI*2;
  const rad = ROAD_INNER - 6 - Math.random()*16;
  if (rad > 4) tree(Math.sin(ang)*rad, Math.cos(ang)*rad);
}

/* ================= BUS STOPS ================= */
const stops = [];
for (let i = 0; i < STOP_COUNT; i++) {
  const ang = (i / STOP_COUNT) * Math.PI * 2;
  const x = Math.sin(ang) * (ROAD_OUTER + 4.5);
  const z = Math.cos(ang) * (ROAD_OUTER + 4.5);
  const color = STOP_COLORS[i];

  const g = new THREE.Group();
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.12,2.6,8), new THREE.MeshStandardMaterial({color:0x555555}));
  pole.position.y = 1.3; pole.castShadow = true;
  const sign = new THREE.Mesh(new THREE.BoxGeometry(1.1,0.75,0.08), new THREE.MeshStandardMaterial({color, emissive: color, emissiveIntensity: 0.25}));
  sign.position.y = 2.5;
  const platform = new THREE.Mesh(new THREE.CylinderGeometry(2.2,2.2,0.15,16), new THREE.MeshStandardMaterial({color:0x8c8c94}));
  platform.position.y = 0.075; platform.receiveShadow = true;
  g.add(pole, sign, platform);
  g.position.set(x,0,z);
  g.lookAt(0,0,0);
  scene.add(g);

  stops.push({ index: i, x, z, color, group: g, waiting: [], nextSpawn: 1 + Math.random()*3 });
}

function spawnPassenger(stop) {
  if (stop.waiting.length >= 4) return;
  let destIdx = stop.index;
  while (destIdx === stop.index) destIdx = Math.floor(Math.random()*STOP_COUNT);
  const fare = 3 + Math.floor(Math.random()*4); // $3-6

  const person = new THREE.Group();
  const bodyColor = STOP_COLORS[destIdx];
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.28,0.6,4,8), new THREE.MeshStandardMaterial({color: bodyColor}));
  body.position.y = 0.75; body.castShadow = true;
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.22,8,8), new THREE.MeshStandardMaterial({color:0xffd9b3}));
  head.position.y = 1.25;
  person.add(body, head);

  const slot = stop.waiting.length;
  const a = (slot/4) * Math.PI*2;
  person.position.set(stop.x + Math.sin(a)*1.4, 0, stop.z + Math.cos(a)*1.4);
  scene.add(person);

  stop.waiting.push({ destIdx, fare, mesh: person });
}

/* ================= BUS MODEL ================= */
const bus = new THREE.Group();
const busMat = new THREE.MeshStandardMaterial({ color: 0xFF9F0A });
const stripeMat = new THREE.MeshStandardMaterial({ color: 0x1c1c22 });
const glassMat = new THREE.MeshStandardMaterial({ color: 0x223344, metalness:0.3, roughness:0.2, emissive:0x0a1420 });
const wheelMat = new THREE.MeshStandardMaterial({ color: 0x0e0e10 });

const body = new THREE.Mesh(new THREE.BoxGeometry(2.6, 2.3, 7.4), busMat);
body.position.y = 1.35; body.castShadow = true; body.receiveShadow = true;
bus.add(body);

const stripe = new THREE.Mesh(new THREE.BoxGeometry(2.65, 0.5, 7.5), stripeMat);
stripe.position.y = 1.05;
bus.add(stripe);

const windshield = new THREE.Mesh(new THREE.BoxGeometry(2.35, 1.1, 0.1), glassMat);
windshield.position.set(0, 1.85, -3.66);
bus.add(windshield);

const sideGlass1 = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.9, 5.6), glassMat);
sideGlass1.position.set(1.32, 1.85, 0.2);
bus.add(sideGlass1);
const sideGlass2 = sideGlass1.clone(); sideGlass2.position.x = -1.32;
bus.add(sideGlass2);

const roofLight = new THREE.Mesh(new THREE.BoxGeometry(1.4,0.15,0.5), new THREE.MeshStandardMaterial({color:0xffffff, emissive:0xffe9c2, emissiveIntensity:0.4}));
roofLight.position.set(0, 2.58, -3.2);
bus.add(roofLight);

[[-0.9,0.85,-3.68],[0.9,0.85,-3.68]].forEach(([x,y,z]) => {
  const hl = new THREE.Mesh(new THREE.SphereGeometry(0.18,8,8), new THREE.MeshStandardMaterial({color:0xfff6d8, emissive:0xfff2b0, emissiveIntensity:0.9}));
  hl.position.set(x,y,z);
  bus.add(hl);
});

function wheel(x,z) {
  const w = new THREE.Mesh(new THREE.CylinderGeometry(0.5,0.5,0.5,14), wheelMat);
  w.rotation.z = Math.PI/2;
  w.position.set(x, 0.5, z);
  w.castShadow = true;
  bus.add(w);
  return w;
}
wheel(1.35, -2.5); wheel(-1.35, -2.5);
wheel(1.35, 2.5); wheel(-1.35, 2.5);

const driverAnchor = new THREE.Object3D();
driverAnchor.position.set(0.55, 1.95, -2.6);
bus.add(driverAnchor);

bus.position.set(0, 0, -ROAD_MID);
scene.add(bus);

/* ================= STATE ================= */
const busState = { x: 0, z: -ROAD_MID, heading: Math.PI, speed: 0 };
let money = parseInt(safeGet('bus_money') || '0', 10);
let onboard = []; // {destIdx, fare}
let camMode = 'third'; // 'third' | 'first'
let started = false;

const input = { steer: 0, throttle: 0 };

/* ================= INPUT ================= */
function bindPad(el, onDown, onUp) {
  const down = (e) => { e.preventDefault(); el.classList.add('active'); onDown(); };
  const up = (e) => { e.preventDefault(); el.classList.remove('active'); onUp(); };
  el.addEventListener('pointerdown', down);
  el.addEventListener('pointerup', up);
  el.addEventListener('pointerleave', up);
  el.addEventListener('pointercancel', up);
}
bindPad(document.getElementById('leftBtn'), ()=>input.steer=-1, ()=>{ if(input.steer===-1) input.steer=0; });
bindPad(document.getElementById('rightBtn'), ()=>input.steer=1, ()=>{ if(input.steer===1) input.steer=0; });
bindPad(document.getElementById('gasBtn'), ()=>input.throttle=1, ()=>{ if(input.throttle===1) input.throttle=0; });
bindPad(document.getElementById('brakeBtn'), ()=>input.throttle=-1, ()=>{ if(input.throttle===-1) input.throttle=0; });

const keys = {};
window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
function readKeyboard() {
  let steer = 0, throttle = 0;
  if (keys['arrowleft'] || keys['a']) steer -= 1;
  if (keys['arrowright'] || keys['d']) steer += 1;
  if (keys['arrowup'] || keys['w']) throttle += 1;
  if (keys['arrowdown'] || keys['s']) throttle -= 1;
  return { steer, throttle };
}

document.getElementById('camBtn').addEventListener('click', () => {
  camMode = camMode === 'third' ? 'first' : 'third';
  document.getElementById('camLabel').textContent = camMode === 'third' ? '3rd Person' : '1st Person';
});

document.getElementById('startBtn').addEventListener('click', () => {
  document.getElementById('startOverlay').style.display = 'none';
  started = true;
});

/* ================= HUD HELPERS ================= */
const moneyEl = document.getElementById('money');
const onboardEl = document.getElementById('onboard');
const speedEl = document.getElementById('speedVal');
const objectiveEl = document.getElementById('objective');
const stopPanelEl = document.getElementById('stopPanel');
const toastLayer = document.getElementById('toastLayer');

function updateMoneyHUD() { moneyEl.textContent = money; safeSet('bus_money', String(money)); }
updateMoneyHUD();
document.getElementById('capacity').textContent = CAPACITY;

function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  toastLayer.appendChild(t);
  setTimeout(() => t.remove(), 1400);
}

/* ================= STOP INTERACTION ================= */
function nearestStop() {
  let best = null, bestDist = Infinity;
  for (const s of stops) {
    const d = Math.hypot(busState.x - s.x, busState.z - s.z);
    if (d < bestDist) { bestDist = d; best = s; }
  }
  return { stop: best, dist: bestDist };
}

function refreshStopPanel() {
  const { stop, dist } = nearestStop();
  const slow = Math.abs(busState.speed) < STOP_SPEED_THRESHOLD;
  const inRange = dist < STOP_TRIGGER_RADIUS;

  if (!inRange || !slow) {
    stopPanelEl.classList.remove('show');
    if (inRange && !slow) objectiveEl.textContent = 'Slow down to stop here';
    else if (onboard.length > 0) objectiveEl.textContent = `Deliver ${onboard.length} passenger(s) to their color stop`;
    else objectiveEl.textContent = 'Drive to a colored stop to pick up passengers';
    return;
  }

  const canPickup = stop.waiting.length > 0 && onboard.length < CAPACITY;
  const dropoffCount = onboard.filter(p => p.destIdx === stop.index).length;

  let html = `<h3>🚏 Stop ${stop.index+1}</h3>`;
  if (canPickup) html += `<button class="stopActionBtn" onclick="window.doPickup(${stop.index})">🧍 Pick up ${Math.min(stop.waiting.length, CAPACITY-onboard.length)}</button>`;
  if (dropoffCount > 0) html += `<button class="stopActionBtn drop" onclick="window.doDropoff(${stop.index})">💰 Drop off ${dropoffCount}</button>`;
  if (!canPickup && dropoffCount === 0) html += `<p style="color:#9a9aab; font-size:12px; margin:0;">Nothing to do here right now</p>`;

  stopPanelEl.innerHTML = html;
  stopPanelEl.classList.add('show');
  objectiveEl.textContent = `At Stop ${stop.index+1}`;
}

window.doPickup = (stopIdx) => {
  const stop = stops[stopIdx];
  const free = CAPACITY - onboard.length;
  const taking = stop.waiting.splice(0, Math.min(free, stop.waiting.length));
  taking.forEach(p => { scene.remove(p.mesh); onboard.push({ destIdx: p.destIdx, fare: p.fare }); });
  onboardEl.textContent = onboard.length;
  toast(`+${taking.length} boarded`);
  refreshStopPanel();
};

window.doDropoff = (stopIdx) => {
  const leaving = onboard.filter(p => p.destIdx === stopIdx);
  onboard = onboard.filter(p => p.destIdx !== stopIdx);
  const earned = leaving.reduce((sum,p) => sum + p.fare, 0);
  money += earned;
  updateMoneyHUD();
  onboardEl.textContent = onboard.length;
  toast(`+$${earned}`);
  refreshStopPanel();
};

/* ================= MINIMAP ================= */
const mmCanvas = document.getElementById('minimap');
const mmCtx = mmCanvas.getContext('2d');
function drawMinimap() {
  const s = 180, c = s/2, scale = c / (ROAD_OUTER + 20);
  mmCtx.clearRect(0,0,s,s);
  mmCtx.fillStyle = '#4f8a3d'; mmCtx.fillRect(0,0,s,s);
  mmCtx.strokeStyle = '#33343a'; mmCtx.lineWidth = (ROAD_OUTER-ROAD_INNER)*scale;
  mmCtx.beginPath(); mmCtx.arc(c,c, ROAD_MID*scale, 0, Math.PI*2); mmCtx.stroke();

  stops.forEach(st => {
    mmCtx.fillStyle = '#' + st.color.toString(16).padStart(6,'0');
    mmCtx.beginPath();
    mmCtx.arc(c + st.x*scale, c + st.z*scale, 6, 0, Math.PI*2);
    mmCtx.fill();
  });

  mmCtx.save();
  mmCtx.translate(c + busState.x*scale, c + busState.z*scale);
  mmCtx.rotate(busState.heading);
  mmCtx.fillStyle = '#fff';
  mmCtx.beginPath();
  mmCtx.moveTo(0,-8); mmCtx.lineTo(5,7); mmCtx.lineTo(-5,7); mmCtx.closePath();
  mmCtx.fill();
  mmCtx.restore();
}

/* ================= PHYSICS + CAMERA ================= */
const tmpVec = new THREE.Vector3();
const camDesired = new THREE.Vector3();

function updatePhysics(dt) {
  const kb = readKeyboard();
  const steerIn = input.steer !== 0 ? input.steer : kb.steer;
  const throttleIn = input.throttle !== 0 ? input.throttle : kb.throttle;

  if (throttleIn > 0) {
    busState.speed += ACCEL * dt;
  } else if (throttleIn < 0) {
    if (busState.speed > 0) busState.speed -= BRAKE_DECEL * dt;
    else busState.speed -= REVERSE_ACCEL * dt;
  } else {
    if (busState.speed > 0) busState.speed = Math.max(0, busState.speed - DRAG*dt);
    else if (busState.speed < 0) busState.speed = Math.min(0, busState.speed + DRAG*dt);
  }

  // Off-road penalty
  const radial = Math.hypot(busState.x, busState.z);
  const offRoad = radial < ROAD_INNER - 1 || radial > ROAD_OUTER + 1;
  const capMax = offRoad ? MAX_SPEED * 0.5 : MAX_SPEED;
  busState.speed = Math.max(-MAX_REVERSE, Math.min(capMax, busState.speed));

  const speedFactor = Math.min(1, Math.abs(busState.speed) / 4);
  const dir = busState.speed >= 0 ? 1 : -1;
  busState.heading += steerIn * STEER_SIGN * TURN_RATE * dt * speedFactor * dir;

  const forwardX = -Math.sin(busState.heading);
  const forwardZ = -Math.cos(busState.heading);
  busState.x += forwardX * busState.speed * dt;
  busState.z += forwardZ * busState.speed * dt;

  bus.position.set(busState.x, 0, busState.z);
  bus.rotation.y = busState.heading;

  speedEl.textContent = Math.round(Math.abs(busState.speed) * 3.6);
}

function updateCamera() {
  if (camMode === 'first') {
    driverAnchor.getWorldPosition(tmpVec);
    camera.position.copy(tmpVec);
    camera.rotation.set(0, busState.heading, 0);
  } else {
    const behindX = Math.sin(busState.heading) * 9;
    const behindZ = Math.cos(busState.heading) * 9;
    camDesired.set(busState.x + behindX, 4.2, busState.z + behindZ);
    camera.position.lerp(camDesired, 0.08);
    camera.lookAt(busState.x, 1.6, busState.z);
  }
}

/* ================= MAIN LOOP ================= */
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, clock.getDelta());

  if (started) {
    updatePhysics(dt);
    refreshStopPanel();
    stops.forEach(s => {
      s.nextSpawn -= dt;
      if (s.nextSpawn <= 0) { spawnPassenger(s); s.nextSpawn = 3 + Math.random()*4; }
    });
  }
  updateCamera();
  drawMinimap();
  renderer.render(scene, camera);
}
animate();
</script>
