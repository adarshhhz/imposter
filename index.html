<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>THE ASSET — Imposter File Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#15130f;
    --panel:#211d16;
    --panel-raised:#2a2519;
    --kraft:#c9a876;
    --kraft-dim:#8f7752;
    --redact:#0a0908;
    --stamp:#9b2226;
    --stamp-bright:#c1372f;
    --paper:#eee6d3;
    --paper-dim:#a89c85;
    --line: rgba(201,168,118,0.18);
    --shadow: 0 20px 50px rgba(0,0,0,0.55);
    --radius: 6px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(ellipse at 20% -10%, rgba(201,168,118,0.07), transparent 55%),
      radial-gradient(ellipse at 100% 110%, rgba(155,34,38,0.08), transparent 50%),
      var(--ink);
    color:var(--paper);
    font-family:'IBM Plex Mono', monospace;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:32px 16px 60px;
    position:relative;
    overflow-x:hidden;
  }
  body::before{
    content:"";
    position:fixed; inset:0;
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px);
    pointer-events:none;
    z-index:0;
  }
  .stage{ width:100%; max-width:520px; position:relative; z-index:1; }

  /* ---------- Header / masthead ---------- */
  .masthead{ text-align:center; margin-bottom:26px; }
  .masthead .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px; letter-spacing:0.35em; text-transform:uppercase;
    color:var(--kraft-dim); margin-bottom:8px;
  }
  .masthead h1{
    font-family:'Oswald', sans-serif;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.06em;
    font-size:clamp(30px,7vw,42px);
    margin:0;
    color:var(--paper);
    line-height:1;
  }
  .masthead h1 span{ color:var(--stamp-bright); }
  .masthead .sub{
    margin-top:10px; font-size:12.5px; color:var(--paper-dim);
    letter-spacing:0.02em;
  }

  /* ---------- Card / dossier shell ---------- */
  .file{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:26px 22px;
    position:relative;
    animation:rise 0.45s ease;
  }
  @keyframes rise{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
  .file::before{
    content:"";
    position:absolute; top:0; left:26px; right:26px; height:14px;
    background:var(--panel-raised);
    border-radius:0 0 4px 4px;
    box-shadow: inset 0 -1px 0 var(--line);
  }
  .file-inner{ position:relative; }

  .tag-row{ display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; }
  .case-no{ font-size:11px; color:var(--kraft-dim); letter-spacing:0.12em; }
  .stamp{
    font-family:'Oswald', sans-serif;
    font-size:11px; font-weight:600; letter-spacing:0.18em; text-transform:uppercase;
    color:var(--stamp-bright);
    border:1.5px solid var(--stamp-bright);
    padding:3px 8px; border-radius:2px;
    transform:rotate(-3deg);
    opacity:0.9;
  }

  h2.section-title{
    font-family:'Oswald', sans-serif; text-transform:uppercase; letter-spacing:0.04em;
    font-size:20px; font-weight:600; color:var(--paper); margin:0 0 4px;
  }
  p.section-desc{ color:var(--paper-dim); font-size:13px; margin:0 0 22px; line-height:1.55; }
  p.text-center{ text-align:center; }

  /* ---------- Form elements ---------- */
  .field{ margin-bottom:20px; }
  .field label{
    display:block; font-size:11px; text-transform:uppercase; letter-spacing:0.14em;
    color:var(--kraft-dim); margin-bottom:9px;
  }
  .stepper{ display:flex; align-items:center; gap:14px; }
  .stepper button{
    width:38px; height:38px; border-radius:2px; border:1px solid var(--line);
    background:var(--panel-raised); color:var(--paper); font-size:18px; cursor:pointer;
    font-family:'IBM Plex Mono', monospace;
  }
  .stepper button:active{ background:var(--kraft-dim); color:var(--ink); }
  .stepper .count{
    font-family:'Oswald', sans-serif; font-size:26px; min-width:40px; text-align:center;
  }

  .name-grid{ display:flex; flex-direction:column; gap:8px; }
  .name-grid input{
    width:100%; padding:10px 12px; background:var(--redact); border:1px solid var(--line);
    color:var(--paper); font-family:'IBM Plex Mono', monospace; font-size:14px; border-radius:2px;
  }
  .name-grid input:focus{ outline:none; border-color:var(--kraft); }
  .name-grid .row{ display:flex; align-items:center; gap:10px; }
  .name-grid .idx{ width:20px; color:var(--kraft-dim); font-size:12px; flex-shrink:0; }

  .chip-grid{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{
    padding:8px 13px; border:1px solid var(--line); border-radius:20px;
    font-size:12.5px; color:var(--paper-dim); cursor:pointer; user-select:none;
    background:var(--panel-raised); transition:all 0.15s ease;
  }
  .chip.active{ border-color:var(--kraft); color:var(--ink); background:var(--kraft); font-weight:600; }

  .toggle-row{ display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-top:1px solid var(--line); }
  .toggle-row:first-of-type{ border-top:none; }
  .toggle-row .label-main{ font-size:13.5px; color:var(--paper); }
  .toggle-row .label-sub{ font-size:11px; color:var(--paper-dim); margin-top:2px; }
  .switch{ width:42px; height:24px; border-radius:14px; background:var(--redact); border:1px solid var(--line); position:relative; cursor:pointer; flex-shrink:0; }
  .switch.on{ background:var(--stamp); border-color:var(--stamp-bright); }
  .switch::after{
    content:""; position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%;
    background:var(--paper); transition:left 0.15s ease;
  }
  .switch.on::after{ left:20px; }

  /* ---------- Buttons ---------- */
  .btn{
    display:block; width:100%; text-align:center;
    font-family:'Oswald', sans-serif; font-weight:600; letter-spacing:0.08em; text-transform:uppercase;
    font-size:14.5px; padding:15px 18px; border-radius:2px; border:none; cursor:pointer;
    background:var(--kraft); color:var(--ink); margin-top:6px;
    transition:transform 0.1s ease, background 0.15s ease;
  }
  .btn:active{ transform:scale(0.98); }
  .btn:disabled{ opacity:0.4; cursor:not-allowed; }
  .btn.secondary{ background:transparent; border:1px solid var(--line); color:var(--paper-dim); }
  .btn.danger{ background:var(--stamp); color:var(--paper); }
  .btn-row{ display:flex; gap:10px; margin-top:6px; }
  .btn-row .btn{ margin-top:0; }

  .error-msg{ color:var(--stamp-bright); font-size:12px; margin-top:-10px; margin-bottom:16px; min-height:14px; }

  /* ---------- 3D Pass / Reveal Mechanics ---------- */
  .pass-wrap{ text-align:center; padding:10px 6px 10px; }
  .pass-wrap p{ color:var(--paper-dim); font-size:13px; line-height:1.6; margin:0 auto 20px; max-width:320px; }
  
  .progress-dots{ display:flex; justify-content:center; gap:6px; margin-bottom:26px; }
  .progress-dots span{ width:7px; height:7px; border-radius:50%; background:var(--line); }
  .progress-dots span.done{ background:var(--kraft-dim); }
  .progress-dots span.current{ background:var(--kraft); }

  /* 3D Card Stage */
  .card-scene {
    perspective: 1200px;
    width: 100%;
    height: 320px;
    margin-bottom: 22px;
    position: relative;
  }
  .card-3d {
    width: 100%;
    height: 100%;
    position: absolute;
    transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(0.4, 0.0, 0.2, 1), opacity 0.4s ease, top 0.5s ease;
    cursor: pointer;
    top: 0;
  }
  /* Card States */
  .card-3d.flipped {
    transform: rotateY(180deg);
  }
  .card-3d.discarded {
    top: 120%;
    opacity: 0;
    pointer-events: none;
    transform: rotateY(180deg) scale(0.8);
  }
  
  /* Card Faces */
  .card-face {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    border-radius: var(--radius);
    border: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 30px 22px;
  }
  
  .card-front {
    background: repeating-linear-gradient(135deg, #0a0908, #0a0908 10px, #100e0a 10px, #100e0a 20px);
    box-shadow: inset 0 0 40px rgba(0,0,0,0.8);
  }
  .card-front .agent-eyebrow { font-size:11px; letter-spacing:0.3em; text-transform:uppercase; color:var(--kraft-dim); }
  .card-front h2 {
    font-family:'Oswald', sans-serif; text-transform:uppercase; font-size:clamp(26px,8vw,36px);
    margin:10px 0 6px; color:var(--paper); text-align: center;
  }
  .card-front .tap-hint { font-size:11px; color:var(--paper-dim); letter-spacing:0.05em; margin-top: 15px; border: 1px dashed var(--line); padding: 5px 10px;}

  .card-back {
    background: var(--redact);
    transform: rotateY(180deg);
  }
  
  /* Card Content Styles */
  .role-kicker{
    font-size:11px; letter-spacing:0.25em; text-transform:uppercase; color:var(--kraft-dim); margin-bottom:14px; text-align: center;
  }
  .role-word{
    font-family:'Oswald', sans-serif; font-weight:700; text-transform:uppercase;
    font-size:clamp(28px,8vw,40px); color:var(--paper); line-height:1.1;
    letter-spacing:0.02em; text-align: center;
  }
  .role-word.imposter{ color:var(--stamp-bright); }
  .role-category{ margin-top:14px; font-size:12px; color:var(--paper-dim); text-align: center;}
  .role-category b{ color:var(--kraft); font-weight:600; }
  .corner-stamp{
    position:absolute; top:12px; right:14px; font-family:'Oswald', sans-serif; font-size:10px;
    letter-spacing:0.15em; color:var(--stamp-bright); border:1px solid var(--stamp-bright);
    padding:2px 6px; border-radius:2px; transform:rotate(6deg); opacity:0.85;
  }

  /* ---------- Results & Interrogation ---------- */
  .interrogate-wrap { padding: 40px 10px; text-align: center; }
  .interrogate-icon { font-size: 40px; margin-bottom: 20px; }
  .results-list{ display:flex; flex-direction:column; gap:8px; margin:18px 0 22px; }
  .result-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:12px 14px; border:1px solid var(--line); border-radius:2px; background:var(--panel-raised);
  }
  .result-row .name{ font-size:13.5px; color:var(--paper); }
  .result-row .role{
    font-family:'Oswald', sans-serif; font-size:11px; text-transform:uppercase; letter-spacing:0.1em;
    padding:3px 8px; border-radius:2px;
  }
  .role.crew{ color:var(--kraft); border:1px solid var(--kraft-dim); }
  .role.imp{ color:var(--stamp-bright); border:1px solid var(--stamp-bright); }
  .answer-banner{
    text-align:center; padding:16px; border:1px dashed var(--kraft-dim); border-radius:2px; margin-bottom:18px;
  }
  .answer-banner .k{ font-size:11px; letter-spacing:0.2em; text-transform:uppercase; color:var(--kraft-dim); }
  .answer-banner .w{ font-family:'Oswald', sans-serif; font-size:24px; color:var(--paper); margin-top:6px; text-transform:uppercase; }

  .footer-note{ text-align:center; color:var(--paper-dim); font-size:11px; margin-top:22px; letter-spacing:0.03em; }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="masthead">
    <div class="eyebrow">Classified Party Protocol</div>
    <h1>THE <span>ASSET</span></h1>
    <div class="sub">One of you doesn't have the file. Find them out.</div>
  </div>

  <div class="file"><div class="file-inner" id="app"></div></div>
  <div class="footer-note" id="footerNote"></div>
</div>

<script>
/* ---------------- Word packs ---------------- */
const PACKS = {
  "Vacation Spots": ["Beach Resort","Mountain Cabin","Cruise Ship","Theme Park","Desert Oasis","Ski Lodge","Safari Camp","Island Villa","National Park","Lakeside Cottage","Rainforest Lodge","Countryside Inn","Casino Resort","Campground","Houseboat","Glacier Tour"],
  "Occupations": ["Surgeon","Firefighter","Pastry Chef","Airline Pilot","Detective","Architect","Zookeeper","Electrician","Diplomat","Lifeguard","Librarian","Locksmith","Tailor","Astronaut","Farmer","Journalist"],
  "Foods & Drinks": ["Sushi Platter","Espresso","Birthday Cake","Grilled Cheese","Ramen Bowl","Iced Tea","Barbecue Ribs","Pancakes","Milkshake","Tacos","Dumplings","Popcorn","Hot Chocolate","Fruit Salad","Pizza","Smoothie"],
  "Everyday Objects": ["Umbrella","Wristwatch","Backpack","Flashlight","Sunglasses","Toothbrush","Stapler","Candle","Mirror","Wallet","Headphones","Keychain","Notebook","Thermos","Ladder","Scissors"],
  "Animals": ["Octopus","Grizzly Bear","Peacock","Honeybee","Dolphin","Chameleon","Penguin","Wolf","Falcon","Tortoise","Otter","Elephant","Firefly","Kangaroo","Hedgehog","Owl"],
  "Sports & Games": ["Chess Match","Rock Climbing","Bowling Night","Marathon","Poker Table","Fencing Duel","Surfing","Archery","Tug of War","Ice Hockey","Darts","Table Tennis","Scavenger Hunt","Rowing Crew","Gymnastics","Trivia Night"]
};

/* ---------------- State ---------------- */
let state = {
  screen: "setup",
  playerCount: 5,
  names: ["","","","",""],
  activeCategories: Object.keys(PACKS),
  imposterCount: 1,
  categoryHint: true,
  // round data
  players: [],       
  secretWord: "",
  secretCategory: "",
  currentIndex: 0,   
};

const app = document.getElementById('app');
const footerNote = document.getElementById('footerNote');

function render(){
  if(state.screen === 'setup') renderSetup();
  else if(state.screen === 'pass') renderPass();
  else if(state.screen === 'interrogate') renderInterrogate();
  else if(state.screen === 'results') renderResults();
}

/* ---------------- SETUP SCREEN ---------------- */
function syncNamesArray(){
  const n = state.playerCount;
  while(state.names.length < n) state.names.push("");
  state.names.length = n;
}

function renderSetup(){
  syncNamesArray();
  footerNote.textContent = "";
  app.innerHTML = `
    <div class="tag-row">
      <div class="case-no">FILE No. ${randomCaseNumber()}</div>
      <div class="stamp">Eyes Only</div>
    </div>
    <h2 class="section-title">New Briefing</h2>
    <p class="section-desc">Set up the roster, pick a category, and hand the device around. Everyone gets the secret word — except the imposter(s).</p>

    <div class="field">
      <label>Agents in play</label>
      <div class="stepper">
        <button id="dec">−</button>
        <div class="count" id="countDisplay">${state.playerCount}</div>
        <button id="inc">+</button>
      </div>
    </div>

    <div class="field">
      <label>Codenames</label>
      <div class="name-grid" id="nameGrid"></div>
    </div>

    <div class="field">
      <label>Categories in rotation</label>
      <div class="chip-grid" id="chipGrid"></div>
    </div>

    <div class="field">
      <div class="toggle-row">
        <div>
          <div class="label-main">Number of imposters</div>
          <div class="label-sub">Recommended: 1 for up to 6 agents</div>
        </div>
        <div class="stepper">
          <button id="impDec">−</button>
          <div class="count" id="impCount" style="font-size:20px;">${state.imposterCount}</div>
          <button id="impInc">+</button>
        </div>
      </div>
      <div class="toggle-row">
        <div>
          <div class="label-main">Give imposter a category hint</div>
          <div class="label-sub">They'll see the category, just not the word</div>
        </div>
        <div class="switch ${state.categoryHint?'on':''}" id="hintToggle"></div>
      </div>
    </div>

    <div class="error-msg" id="setupError"></div>
    <button class="btn" id="beginBtn">Begin Briefing →</button>
  `;

  const nameGrid = document.getElementById('nameGrid');
  state.names.forEach((val, i) => {
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `<div class="idx">${String(i+1).padStart(2,'0')}</div>
      <input type="text" maxlength="16" placeholder="Agent ${i+1}" value="${escapeHtml(val)}" data-idx="${i}">`;
    nameGrid.appendChild(row);
  });
  nameGrid.querySelectorAll('input').forEach(inp=>{
    inp.addEventListener('input', e=>{
      state.names[parseInt(e.target.dataset.idx)] = e.target.value;
    });
  });

  const chipGrid = document.getElementById('chipGrid');
  Object.keys(PACKS).forEach(cat=>{
    const chip = document.createElement('div');
    chip.className = 'chip' + (state.activeCategories.includes(cat) ? ' active' : '');
    chip.textContent = cat;
    chip.addEventListener('click', ()=>{
      if(state.activeCategories.includes(cat)){
        if(state.activeCategories.length > 1){
          state.activeCategories = state.activeCategories.filter(c=>c!==cat);
        }
      } else {
        state.activeCategories.push(cat);
      }
      renderSetup();
    });
    chipGrid.appendChild(chip);
  });

  document.getElementById('dec').addEventListener('click', ()=>{
    if(state.playerCount > 3){ state.playerCount--; clampImposters(); renderSetup(); }
  });
  document.getElementById('inc').addEventListener('click', ()=>{
    if(state.playerCount < 16){ state.playerCount++; renderSetup(); }
  });
  document.getElementById('impDec').addEventListener('click', ()=>{
    if(state.imposterCount > 1){ state.imposterCount--; renderSetup(); }
  });
  document.getElementById('impInc').addEventListener('click', ()=>{
    const maxImp = Math.max(1, Math.floor(state.playerCount/2) - 1) || 1;
    if(state.imposterCount < maxImp){ state.imposterCount++; renderSetup(); }
  });
  document.getElementById('hintToggle').addEventListener('click', ()=>{
    state.categoryHint = !state.categoryHint;
    renderSetup();
  });
  document.getElementById('beginBtn').addEventListener('click', startRound);
}

function clampImposters(){
  const maxImp = Math.max(1, Math.floor(state.playerCount/2) - 1) || 1;
  if(state.imposterCount > maxImp) state.imposterCount = maxImp;
}

function startRound(){
  const errBox = document.getElementById('setupError');
  if(state.activeCategories.length === 0){
    errBox.textContent = "Select at least one category.";
    return;
  }
  
  const finalNames = state.names.map((n,i)=> n.trim() || `Agent ${i+1}`);
  const dupCheck = new Set(finalNames);
  const usedNames = finalNames.map((n,i)=> dupCheck.size < finalNames.length ? `${n} #${i+1}` : n);

  const category = state.activeCategories[Math.floor(Math.random()*state.activeCategories.length)];
  const wordList = PACKS[category];
  const word = wordList[Math.floor(Math.random()*wordList.length)];

  const indices = [...Array(state.playerCount).keys()];
  shuffle(indices);
  const imposterSet = new Set(indices.slice(0, state.imposterCount));

  state.players = usedNames.map((name, i)=>({
    name,
    role: imposterSet.has(i) ? 'imposter' : 'crew'
  }));
  state.secretWord = word;
  state.secretCategory = category;
  state.currentIndex = 0;
  state.screen = 'pass';
  render();
}

/* ---------------- HOLD TO REVEAL SCREEN ---------------- */
function renderPass(){
  const p = state.players[state.currentIndex];
  const total = state.players.length;
  footerNote.textContent = `Agent ${state.currentIndex+1} of ${total} — keep the device flat between turns`;

  let dots = '';
  for(let i=0;i<total;i++){
    let cls = i < state.currentIndex ? 'done' : (i===state.currentIndex ? 'current':'');
    dots += `<span class="${cls}"></span>`;
  }

  app.innerHTML = `
    <div class="pass-wrap">
      <div class="progress-dots">${dots}</div>
      <p>Pass the device to <b>${escapeHtml(p.name)}</b>. Ensure no one else is looking.</p>
    </div>
    
    <div class="card-scene">
      <div class="card-3d" id="activeCard">
        <!-- Front of Card -->
        <div class="card-face card-front">
          <div class="agent-eyebrow">Classified File</div>
          <h2>${escapeHtml(p.name)}</h2>
          <div class="tap-hint">PRESS & HOLD TO REVEAL</div>
        </div>
        
        <!-- Back of Card -->
        <div class="card-face card-back">
          <div class="corner-stamp">${p.role==='imposter' ? 'Unverified' : 'Verified'}</div>
          ${p.role === 'imposter' ? `
            <div class="role-kicker">Status</div>
            <div class="role-word imposter">You Are<br>The Imposter</div>
            ${state.categoryHint ? `<div class="role-category">Category on record: <br><b>${escapeHtml(state.secretCategory)}</b></div>` : `<div class="role-category">No further intel provided.</div>`}
          ` : `
            <div class="role-kicker">The Secret Word</div>
            <div class="role-word">${escapeHtml(state.secretWord)}</div>
            <div class="role-category">Category: <b>${escapeHtml(state.secretCategory)}</b></div>
          `}
        </div>
      </div>
    </div>
    
    <button class="btn secondary" id="backBtn" style="margin-top:10px;">Cancel Round</button>
  `;

  const card = document.getElementById('activeCard');
  let hasDiscarded = false;

  const startHold = (e) => {
    if(hasDiscarded) return;
    e.preventDefault();
    card.classList.add('flipped');
  };

  const endHold = (e) => {
    if(hasDiscarded || !card.classList.contains('flipped')) return;
    hasDiscarded = true; // Prevent multiple fires
    card.classList.remove('flipped');
    card.classList.add('discarded');

    // Cleanup events
    card.removeEventListener('mousedown', startHold);
    card.removeEventListener('touchstart', startHold);
    window.removeEventListener('mouseup', endHold);
    window.removeEventListener('touchend', endHold);

    // Wait for the CSS discard animation to finish before moving on
    setTimeout(() => {
      if (state.currentIndex < total - 1) {
        state.currentIndex++;
        renderPass();
      } else {
        state.screen = 'interrogate';
        render();
      }
    }, 500); 
  };

  // Bind Interactions
  card.addEventListener('mousedown', startHold);
  card.addEventListener('touchstart', startHold, {passive: false});
  window.addEventListener('mouseup', endHold);
  window.addEventListener('touchend', endHold);

  document.getElementById('backBtn').addEventListener('click', ()=>{
    if(confirm('Cancel this round and return to setup?')){
       // Cleanup window events just in case
      window.removeEventListener('mouseup', endHold);
      window.removeEventListener('touchend', endHold);
      state.screen = 'setup';
      render();
    }
  });
}

/* ---------------- INTERROGATION (REPLACES TIMER) ---------------- */
function renderInterrogate(){
  footerNote.textContent = "Discuss, question, and vote out whoever seems off.";
  
  app.innerHTML = `
    <div class="tag-row">
      <div class="case-no">FILE No. ${randomCaseNumber()}</div>
      <div class="stamp">In Session</div>
    </div>
    
    <div class="interrogate-wrap">
      <div class="interrogate-icon">💬</div>
      <h2 class="section-title">Interrogation Phase</h2>
      <p class="section-desc">All agents have viewed their files. Determine who is lying about their intel.</p>
    </div>
    
    <div class="btn-row">
      <button class="btn danger" id="revealAllBtn">End Discussion & Reveal Roles</button>
    </div>
  `;

  document.getElementById('revealAllBtn').addEventListener('click', ()=>{
    if(confirm("Are you sure you want to reveal everyone's roles?")) {
      state.screen = 'results';
      render();
    }
  });
}

/* ---------------- RESULTS SCREEN ---------------- */
function renderResults(){
  footerNote.textContent = "";
  const imposters = state.players.filter(p=>p.role==='imposter').map(p=>p.name);
  app.innerHTML = `
    <div class="tag-row">
      <div class="case-no">FILE No. ${randomCaseNumber()}</div>
      <div class="stamp">Declassified</div>
    </div>
    <h2 class="section-title">Case Closed</h2>
    <p class="section-desc">${imposters.length>1?'The imposters were':'The imposter was'} <b style="color:var(--stamp-bright)">${imposters.map(escapeHtml).join(', ')}</b>.</p>

    <div class="answer-banner">
      <div class="k">The Word Was</div>
      <div class="w">${escapeHtml(state.secretWord)}</div>
    </div>

    <div class="results-list">
      ${state.players.map(p=>`
        <div class="result-row">
          <div class="name">${escapeHtml(p.name)}</div>
          <div class="role ${p.role==='imposter'?'imp':'crew'}">${p.role==='imposter'?'Imposter':'Crew'}</div>
        </div>
      `).join('')}
    </div>

    <div class="btn-row">
      <button class="btn secondary" id="newRoundBtn">Same Roster, New Round</button>
      <button class="btn" id="restartBtn">New Setup</button>
    </div>
  `;

  document.getElementById('newRoundBtn').addEventListener('click', ()=>{
    startRound();
  });
  document.getElementById('restartBtn').addEventListener('click', ()=>{
    state.screen = 'setup';
    render();
  });
}

/* ---------------- Helpers ---------------- */
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function randomCaseNumber(){
  if(!window.__caseNo){
    window.__caseNo = Math.floor(1000+Math.random()*8999) + '-' + String.fromCharCode(65+Math.floor(Math.random()*26)) + String.fromCharCode(65+Math.floor(Math.random()*26));
  }
  return window.__caseNo;
}

render();
</script>
