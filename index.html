<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Imposter Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-main: #121216;
    --bg-card: #1C1C24;
    --bg-input: #252530;
    --text-main: #FFFFFF;
    --text-muted: #8E8E9E;
    --accent: #FF9F0A;
    --accent-dark: #CC7E00;
    --danger: #FF453A;
    --radius: 16px;
    --radius-sm: 10px;
  }
  
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; font-family: 'Inter', sans-serif; background-color: var(--bg-main); color: var(--text-main); overflow-x: hidden; }
  
  /* Onam Flower Animation */
  .flower {
    position: fixed;
    top: -10vh;
    z-index: 9999;
    pointer-events: none;
    user-select: none;
    font-size: 14px;
    animation: fall linear infinite;
  }
  @keyframes fall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
  }

  .app-container {
    max-width: 500px;
    margin: 0 auto;
    min-height: 100vh;
    padding: 20px 16px 100px; /* Padding for bottom bar */
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* Typography */
  h1 { font-size: 24px; font-weight: 700; text-align: center; margin: 10px 0 4px; }
  .subtitle { text-align: center; color: var(--text-muted); font-size: 14px; margin-bottom: 24px; }
  
  /* Cards */
  .card {
    background: var(--bg-card);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 16px;
  }
  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    font-weight: 600;
    font-size: 15px;
  }
  .card-header .count { color: var(--text-muted); font-size: 13px; font-weight: 400; }

  /* Player List */
  .player-list { display: flex; flex-direction: column; gap: 10px; }
  .player-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .player-idx {
    width: 28px; height: 28px;
    background: var(--accent-dark);
    color: #FFF;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 600;
    flex-shrink: 0;
  }
  .player-input-wrap {
    flex: 1;
    background: var(--bg-input);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    display: flex; align-items: center;
  }
  .player-input-wrap input {
    background: transparent; border: none; color: var(--text-main); font-size: 15px; width: 100%; outline: none; font-family: 'Inter', sans-serif;
  }
  .del-btn {
    background: none; border: none; color: var(--text-muted); padding: 5px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .del-btn:hover { color: var(--danger); }
  
  .add-player-btn {
    width: 100%; background: transparent; border: 1px dashed var(--text-muted); color: var(--text-muted); padding: 12px; border-radius: var(--radius-sm); margin-top: 10px; cursor: pointer; font-size: 15px; font-weight: 500;
  }

  /* Settings Toggles */
  .setting-row {
    display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #30303C; cursor: pointer;
  }
  .setting-row:last-child { border-bottom: none; }
  .setting-info { display: flex; gap: 12px; align-items: center; }
  .setting-icon { color: var(--accent); font-size: 18px; }
  .setting-text h3 { margin: 0; font-size: 15px; font-weight: 500; }
  .setting-text p { margin: 4px 0 0; font-size: 12px; color: var(--text-muted); }
  
  /* Toggle Switch */
  .switch {
    width: 44px; height: 24px; background: var(--bg-input); border-radius: 12px; position: relative; transition: 0.3s;
  }
  .switch::after {
    content: ''; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; background: #FFF; border-radius: 50%; transition: 0.3s;
  }
  .switch.active { background: var(--accent); }
  .switch.active::after { transform: translateX(20px); }

  /* Bottom Bar */
  .bottom-bar {
    position: fixed; bottom: 0; left: 0; right: 0; padding: 16px; background: var(--bg-main); border-top: 1px solid #202028; display: flex; justify-content: center; z-index: 10;
  }
  .bottom-bar .inner { width: 100%; max-width: 500px; }
  .start-btn {
    width: 100%; background: var(--accent); color: #000; font-weight: 600; font-size: 16px; padding: 16px; border: none; border-radius: var(--radius-sm); cursor: pointer; font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .start-btn:active { opacity: 0.8; transform: scale(0.98); }

  /* Chips */
  .chip-container { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .chip { background: var(--bg-input); color: var(--text-muted); padding: 8px 14px; border-radius: 20px; font-size: 13px; cursor: pointer; }
  .chip.active { background: var(--accent-dark); color: #FFF; border: 1px solid var(--accent); }

  /* Admin Panel specific */
  .admin-box { background: var(--bg-card); padding: 20px; border-radius: var(--radius); margin-bottom: 20px;}
  .admin-input { width: 100%; padding: 12px; background: var(--bg-input); border: 1px solid #30303C; color: #FFF; border-radius: 8px; margin-bottom: 10px; font-size: 16px;}
  .admin-btn { background: var(--accent); color: #000; padding: 10px 16px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }
  .admin-btn-secondary { background: var(--bg-input); color: #FFF; border: 1px solid #30303C; padding: 10px 16px; border-radius: 8px; cursor: pointer; }
  .word-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .word-chip { background: var(--bg-input); padding: 5px 10px; border-radius: 4px; font-size: 12px; display: flex; align-items: center; gap: 5px; }
  
  /* In-game screens (adapted for dark theme) */
  .game-screen { text-align: center; padding-top: 40px; }
  .card-3d-wrap { perspective: 1000px; width: 100%; height: 300px; margin: 30px 0; position: relative; }
  .card-3d { width: 100%; height: 100%; transition: transform 0.6s, top 0.5s, opacity 0.5s; transform-style: preserve-3d; cursor: pointer; position: absolute; top:0; }
  .card-3d.flipped { transform: rotateY(180deg); }
  .card-3d.discarded { top: 100%; opacity: 0; pointer-events: none; transform: rotateY(180deg) scale(0.8); }
  .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: var(--radius); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; border: 1px solid #30303C; }
  .card-front { background: var(--bg-card); }
  .card-back { background: var(--bg-input); transform: rotateY(180deg); }
  .tap-hint { border: 1px dashed var(--text-muted); color: var(--text-muted); padding: 8px 12px; border-radius: 6px; font-size: 12px; margin-top: 20px; }
  
</style>
</head>
<body>

<div class="app-container" id="app"></div>

<script>
/* ---------------- Initial Data & Storage ---------------- */
const defaultPacks = {
  "Vacation Spots": ["Beach Resort","Mountain Cabin","Cruise Ship","Theme Park","Desert Oasis","Ski Lodge","Safari Camp","Island Villa"],
  "Occupations": ["Surgeon","Firefighter","Pastry Chef","Airline Pilot","Detective","Architect","Zookeeper","Electrician"],
  "Foods & Drinks": ["Sushi Platter","Espresso","Birthday Cake","Grilled Cheese","Ramen Bowl","Iced Tea","Barbecue Ribs","Pancakes"]
};

// Load packs from localStorage, or use defaults
let PACKS = JSON.parse(localStorage.getItem('imposterPacks')) || defaultPacks;

function savePacks() {
  localStorage.setItem('imposterPacks', JSON.stringify(PACKS));
}

/* ---------------- Onam Flowers Animation ---------------- */
function startOnamFlowers() {
  const emojis = ['🌸', '🌼', '🌺', '🍃'];
  for (let i = 0; i < 25; i++) {
    let flower = document.createElement('div');
    flower.className = 'flower';
    flower.innerText = emojis[Math.floor(Math.random() * emojis.length)];
    flower.style.left = Math.random() * 100 + 'vw';
    flower.style.animationDuration = (Math.random() * 3 + 4) + 's'; // 4-7s
    flower.style.animationDelay = Math.random() * 5 + 's';
    flower.style.fontSize = (Math.random() * 10 + 10) + 'px';
    document.body.appendChild(flower);
  }
}
startOnamFlowers(); // Start immediately

/* ---------------- State ---------------- */
let state = {
  names: ["Anu", "Anju", "Babu", "Ragesh", "Abhi", "Adarsh"],
  activeCategories: Object.keys(PACKS),
  imposterCount: 1,
  imposterSeesCategory: true,
  showImposterHint: false, // New feature from screenshot
  
  // Game running state
  players: [],       
  secretWord: "",
  secretCategory: "",
  imposterHintWord: "", 
  currentIndex: 0,
  
  // Admin State
  adminAuthenticated: false,
  adminSelectedCategory: null
};

const app = document.getElementById('app');

/* ---------------- Router ---------------- */
function render() {
  const hash = window.location.hash;
  if (hash === '#admin') {
    if (!state.adminAuthenticated) renderAdminLogin();
    else renderAdminPanel();
  } else if (hash === '#play') {
    renderPass();
  } else if (hash === '#interrogate') {
    renderInterrogate();
  } else if (hash === '#results') {
    renderResults();
  } else {
    renderSetup(); // Default
  }
}
window.addEventListener('hashchange', render);

/* ---------------- SVG Icons ---------------- */
const icons = {
  trash: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>`,
  tag: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path><line x1="7" y1="7" x2="7.01" y2="7"></line></svg>`,
  bulb: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"></path><path d="M10 22h4"></path><path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5A4.61 4.61 0 0 1 8.91 14"></path></svg>`,
  play: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>`,
  admin: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>`
};

/* ---------------- 1. Setup Screen ---------------- */
function renderSetup() {
  let categoriesHTML = Object.keys(PACKS).map(cat => {
    const isActive = state.activeCategories.includes(cat);
    return `<div class="chip ${isActive ? 'active' : ''}" onclick="toggleCategory('${cat}')">${cat}</div>`;
  }).join('');

  app.innerHTML = `
    <h1>Set up game</h1>
    <div class="subtitle">Configure before starting</div>

    <div class="card">
      <div class="card-header">
        <span>👥 Players</span>
        <span class="count">${state.names.length} / 15</span>
      </div>
      <div class="player-list" id="playerList"></div>
      ${state.names.length < 15 ? `<button class="add-player-btn" onclick="addPlayer()">+ Add Player</button>` : ''}
    </div>

    <div class="card">
      <div class="setting-row" style="border-bottom:none;">
        <div class="setting-info">
          <div class="setting-icon">${icons.tag}</div>
          <div class="setting-text">
            <h3>Categories</h3>
            <p>${state.activeCategories.length} of ${Object.keys(PACKS).length} selected</p>
          </div>
        </div>
      </div>
      <div class="chip-container">${categoriesHTML}</div>
    </div>

    <div class="card">
      <div class="setting-row" onclick="toggleSetting('imposterSeesCategory')">
        <div class="setting-info">
          <div class="setting-icon">${icons.tag}</div>
          <div class="setting-text">
            <h3>Imposter sees category</h3>
            <p>Imposter can see the category name</p>
          </div>
        </div>
        <div class="switch ${state.imposterSeesCategory ? 'active' : ''}"></div>
      </div>
      
      <div class="setting-row" onclick="toggleSetting('showImposterHint')">
        <div class="setting-info">
          <div class="setting-icon">${icons.bulb}</div>
          <div class="setting-text">
            <h3>Show imposter a hint</h3>
            <p>Imposter sees a related but different word</p>
          </div>
        </div>
        <div class="switch ${state.showImposterHint ? 'active' : ''}"></div>
      </div>
      
      <div class="setting-row" onclick="window.location.hash='#admin'">
        <div class="setting-info">
          <div class="setting-icon">${icons.admin}</div>
          <div class="setting-text">
            <h3>Admin Panel</h3>
            <p>Customize words and categories</p>
          </div>
        </div>
      </div>
    </div>

    <div class="bottom-bar">
      <div class="inner">
        <button class="start-btn" onclick="startGame()">
          ${icons.play} Start Game
        </button>
      </div>
    </div>
  `;

  // Render Player Inputs
  const list = document.getElementById('playerList');
  state.names.forEach((name, i) => {
    list.innerHTML += `
      <div class="player-row">
        <div class="player-idx">${i + 1}</div>
        <div class="player-input-wrap">
          <input type="text" value="${escapeHtml(name)}" onchange="updatePlayerName(${i}, this.value)" placeholder="Player Name">
          <button class="del-btn" onclick="removePlayer(${i})">${icons.trash}</button>
        </div>
      </div>
    `;
  });
}

// Setup Helper Functions
window.updatePlayerName = (idx, val) => { state.names[idx] = val; };
window.addPlayer = () => { if (state.names.length < 15) { state.names.push(""); renderSetup(); } };
window.removePlayer = (idx) => { if (state.names.length > 3) { state.names.splice(idx, 1); renderSetup(); } else { alert("Minimum 3 players required."); } };
window.toggleCategory = (cat) => {
  if (state.activeCategories.includes(cat)) {
    if (state.activeCategories.length > 1) state.activeCategories = state.activeCategories.filter(c => c !== cat);
  } else {
    state.activeCategories.push(cat);
  }
  renderSetup();
};
window.toggleSetting = (key) => { state[key] = !state[key]; renderSetup(); };

function startGame() {
  if (state.activeCategories.length === 0) return alert("Select at least one category.");
  
  // Clean names
  const finalNames = state.names.map((n, i) => n.trim() || `Player ${i + 1}`);
  
  // Pick word
  const category = state.activeCategories[Math.floor(Math.random() * state.activeCategories.length)];
  const wordList = PACKS[category];
  
  if (!wordList || wordList.length === 0) return alert("Selected category has no words! Add words in Admin.");
  
  const wordIdx = Math.floor(Math.random() * wordList.length);
  const word = wordList[wordIdx];
  
  // Hint logic
  let hintWord = "";
  if (state.showImposterHint && wordList.length > 1) {
    let hintIdx = wordIdx;
    while(hintIdx === wordIdx) { hintIdx = Math.floor(Math.random() * wordList.length); }
    hintWord = wordList[hintIdx];
  }

  // Assign roles
  const indices = [...Array(finalNames.length).keys()];
  for (let i = indices.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [indices[i], indices[j]] = [indices[j], indices[i]];
  }
  
  const imposterSet = new Set(indices.slice(0, state.imposterCount));

  state.players = finalNames.map((name, i) => ({
    name,
    role: imposterSet.has(i) ? 'imposter' : 'crew'
  }));
  state.secretWord = word;
  state.secretCategory = category;
  state.imposterHintWord = hintWord;
  state.currentIndex = 0;
  
  window.location.hash = '#play';
}

/* ---------------- 2. Admin Panel ---------------- */
function renderAdminLogin() {
  app.innerHTML = `
    <div class="game-screen">
      <h1>Admin Access</h1>
      <p class="subtitle">Enter password to manage words</p>
      <div class="admin-box">
        <input type="password" id="adminPwd" class="admin-input" placeholder="Password">
        <button class="admin-btn" style="width:100%" onclick="checkAdmin()">Login</button>
      </div>
      <button class="admin-btn-secondary" onclick="window.location.hash=''">Back to Setup</button>
    </div>
  `;
}

window.checkAdmin = () => {
  if (document.getElementById('adminPwd').value === 'adarsh@12345') {
    state.adminAuthenticated = true;
    renderAdminPanel();
  } else {
    alert("Incorrect password");
  }
};

function renderAdminPanel() {
  if (state.adminSelectedCategory) {
    // Show Words in Category
    const cat = state.adminSelectedCategory;
    const words = PACKS[cat];
    
    app.innerHTML = `
      <h1>Manage Words</h1>
      <p class="subtitle">Category: ${cat}</p>
      
      <div class="admin-box">
        <div style="display:flex; gap:10px; margin-bottom:15px;">
          <input type="text" id="newWord" class="admin-input" style="margin:0;" placeholder="New word...">
          <button class="admin-btn" onclick="addWord('${cat}')">Add</button>
        </div>
        <div class="word-list">
          ${words.map((w, i) => `
            <div class="word-chip">
              ${escapeHtml(w)}
              <span style="color:var(--danger); cursor:pointer; margin-left:5px;" onclick="deleteWord('${cat}', ${i})">✖</span>
            </div>
          `).join('')}
        </div>
      </div>
      <button class="admin-btn-secondary" onclick="state.adminSelectedCategory=null; renderAdminPanel();">Back to Categories</button>
    `;
  } else {
    // Show Categories
    app.innerHTML = `
      <h1>Admin Panel</h1>
      <p class="subtitle">Manage Categories & Words</p>
      
      <div class="admin-box">
        <div style="display:flex; gap:10px; margin-bottom:15px;">
          <input type="text" id="newCat" class="admin-input" style="margin:0;" placeholder="New category...">
          <button class="admin-btn" onclick="addCategory()">Add</button>
        </div>
        <div class="player-list">
          ${Object.keys(PACKS).map(cat => `
            <div class="player-row" style="background:var(--bg-input); padding:10px; border-radius:8px;">
              <div style="flex:1; cursor:pointer;" onclick="state.adminSelectedCategory='${cat}'; renderAdminPanel();">
                ${cat} (${PACKS[cat].length} words)
              </div>
              <button class="del-btn" onclick="deleteCategory('${cat}')">${icons.trash}</button>
            </div>
          `).join('')}
        </div>
      </div>
      
      <button class="admin-btn" style="width:100%; margin-bottom:10px;" onclick="factoryReset()">Reset to Defaults</button>
      <button class="admin-btn-secondary" style="width:100%;" onclick="window.location.hash=''">Save & Back to Game</button>
    `;
  }
}

window.addCategory = () => {
  const val = document.getElementById('newCat').value.trim();
  if (val && !PACKS[val]) { PACKS[val] = []; savePacks(); renderAdminPanel(); }
};
window.deleteCategory = (cat) => {
  if (confirm(`Delete category "${cat}"?`)) { delete PACKS[cat]; savePacks(); renderAdminPanel(); }
};
window.addWord = (cat) => {
  const val = document.getElementById('newWord').value.trim();
  if (val) { PACKS[cat].push(val); savePacks(); renderAdminPanel(); }
};
window.deleteWord = (cat, idx) => {
  PACKS[cat].splice(idx, 1); savePacks(); renderAdminPanel();
};
window.factoryReset = () => {
  if (confirm("Reset all words to default? Custom words will be lost.")) {
    PACKS = JSON.parse(JSON.stringify(defaultPacks)); savePacks(); renderAdminPanel();
  }
};

/* ---------------- 3. Play / Hold-to-Reveal ---------------- */
function renderPass() {
  const p = state.players[state.currentIndex];
  const total = state.players.length;
  
  app.innerHTML = `
    <div class="game-screen">
      <div class="subtitle">Agent ${state.currentIndex + 1} of ${total}</div>
      <p style="color:var(--text-muted); font-size:14px;">Pass device to <b style="color:var(--text-main)">${escapeHtml(p.name)}</b></p>
      
      <div class="card-3d-wrap">
        <div class="card-3d" id="activeCard">
          <div class="card-face card-front">
            <div style="color:var(--accent); font-weight:600; font-size:12px; letter-spacing:2px;">CLASSIFIED</div>
            <h2 style="font-size:32px; margin:10px 0;">${escapeHtml(p.name)}</h2>
            <div class="tap-hint">PRESS & HOLD TO REVEAL</div>
          </div>
          
          <div class="card-face card-back">
            ${p.role === 'imposter' ? `
              <div style="color:var(--danger); font-size:12px; font-weight:700; letter-spacing:2px; margin-bottom:10px;">STATUS</div>
              <h2 style="color:var(--danger); font-size:32px; margin:0; line-height:1.2;">You Are<br>The Imposter</h2>
              ${state.imposterSeesCategory ? `<div style="margin-top:20px; font-size:14px; color:var(--text-muted);">Category:<br><b style="color:var(--text-main)">${escapeHtml(state.secretCategory)}</b></div>` : ''}
              ${state.showImposterHint ? `<div style="margin-top:10px; font-size:14px; color:var(--text-muted);">Fake Hint Word:<br><b style="color:var(--accent)">${escapeHtml(state.imposterHintWord)}</b></div>` : ''}
            ` : `
              <div style="color:var(--text-muted); font-size:12px; font-weight:700; letter-spacing:2px; margin-bottom:10px;">THE SECRET WORD</div>
              <h2 style="font-size:32px; margin:0; color:var(--accent);">${escapeHtml(state.secretWord)}</h2>
              <div style="margin-top:20px; font-size:14px; color:var(--text-muted);">Category: <b style="color:var(--text-main)">${escapeHtml(state.secretCategory)}</b></div>
            `}
          </div>
        </div>
      </div>
      
      <button class="admin-btn-secondary" onclick="if(confirm('Cancel round?')) window.location.hash=''">Cancel Round</button>
    </div>
  `;

  const card = document.getElementById('activeCard');
  let hasDiscarded = false;

  const startHold = (e) => {
    if(hasDiscarded) return;
    e.preventDefault();
    card.classList.add('flipped');
  };

  const endHold = (e) => {
    if(hasDiscarded || !card.classList.contains('flipped')) return;
    hasDiscarded = true; 
    card.classList.remove('flipped');
    card.classList.add('discarded');

    card.removeEventListener('mousedown', startHold);
    card.removeEventListener('touchstart', startHold);
    window.removeEventListener('mouseup', endHold);
    window.removeEventListener('touchend', endHold);

    setTimeout(() => {
      if (state.currentIndex < total - 1) {
        state.currentIndex++;
        renderPass();
      } else {
        window.location.hash = '#interrogate';
      }
    }, 500); 
  };

  card.addEventListener('mousedown', startHold);
  card.addEventListener('touchstart', startHold, {passive: false});
  window.addEventListener('mouseup', endHold);
  window.addEventListener('touchend', endHold);
}

/* ---------------- 4. Interrogation ---------------- */
function renderInterrogate() {
  app.innerHTML = `
    <div class="game-screen" style="padding-top:20px;">
      <div style="font-size:50px; margin-bottom:10px;">💬</div>
      <h1>Interrogation Phase</h1>
      <p class="subtitle" style="margin-bottom:40px;">Discuss and vote out the imposter.</p>
      
      <button class="start-btn" style="background:var(--danger); color:#FFF; margin-bottom:15px;" onclick="window.location.hash='#results'">
        Reveal Roles
      </button>
    </div>
  `;
}

/* ---------------- 5. Results ---------------- */
function renderResults() {
  const imposters = state.players.filter(p => p.role === 'imposter').map(p => p.name);
  app.innerHTML = `
    <div class="game-screen" style="padding-top:20px;">
      <div style="color:var(--text-muted); font-size:12px; font-weight:700; letter-spacing:2px; margin-bottom:10px;">CASE CLOSED</div>
      <h1>The Imposter was <span style="color:var(--danger)">${imposters.map(escapeHtml).join(', ')}</span></h1>
      
      <div style="border: 1px dashed #30303C; padding: 20px; border-radius: var(--radius); margin: 30px 0;">
        <div style="font-size:12px; color:var(--text-muted); margin-bottom:5px;">THE WORD WAS</div>
        <div style="font-size:24px; color:var(--accent); font-weight:700; text-transform:uppercase;">${escapeHtml(state.secretWord)}</div>
      </div>
      
      <div class="player-list" style="text-align:left; margin-bottom:30px;">
        ${state.players.map(p => `
          <div class="player-row" style="background:var(--bg-card); padding:12px; border-radius:8px; justify-content:space-between;">
            <div>${escapeHtml(p.name)}</div>
            <div style="font-size:12px; font-weight:600; padding:4px 8px; border-radius:4px; ${p.role==='imposter' ? 'background:#FF453A22; color:var(--danger);' : 'background:#FF9F0A22; color:var(--accent);'}">${p.role === 'imposter' ? 'IMPOSTER' : 'CREW'}</div>
          </div>
        `).join('')}
      </div>

      <button class="start-btn" style="margin-bottom:10px;" onclick="startGame()">Same Roster, New Word</button>
      <button class="admin-btn-secondary" style="width:100%" onclick="window.location.hash=''">New Setup</button>
    </div>
  `;
}

/* ---------------- Helpers ---------------- */
function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

// Init
render();
</script>
</body>
</html>
