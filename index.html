<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Imposter Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<!-- Add Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

<style>
  :root {
    --bg-main: #121216;
    --bg-card: rgba(28, 28, 36, 0.75); /* Translucent for background image */
    --bg-input: rgba(37, 37, 48, 0.9);
    --text-main: #FFFFFF;
    --text-muted: #A0A0B0;
    --accent: #FF9F0A;
    --accent-dark: #CC7E00;
    --danger: #FF453A;
    --success: #32D74B;
    --radius: 16px;
    --radius-sm: 10px;
    --max-w: 540px;
  }
  
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  /* Global Background using your Cloudinary image */
  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
    font-family: 'Inter', sans-serif;
    background: linear-gradient(rgba(18, 18, 22, 0.65), rgba(18, 18, 22, 0.85)), url('https://res.cloudinary.com/uzfgyrxf/image/upload/v1787806687/pixel-art-style-floral-garden-illustration_23-2151503920_1.jpg') center/cover fixed no-repeat;
    background-color: var(--bg-main); /* Fallback */
    color: var(--text-main);
    overflow-x: hidden;
  }

  /* Setup-screen-only background override (Apple-glass look) */
  body.setup-bg {
    background:
      linear-gradient(rgba(10, 10, 14, 0.55), rgba(10, 10, 14, 0.78)),
      url('https://res.cloudinary.com/uzfgyrxf/image/upload/v1787806687/pixel-art-style-floral-garden-illustration_23-2151503920_1.jpg') center/cover fixed no-repeat;
  }

  /* Welcome-screen-only full background */
  body.welcome-bg {
    background:
      linear-gradient(rgba(10, 10, 14, 0.35), rgba(10, 10, 14, 0.55)),
      url('https://res.cloudinary.com/uzfgyrxf/image/upload/v1787807028/file_00000000e9448211b6d1eeef8edc2c67.png') center/cover fixed no-repeat;
  }
  
  /* Toast */
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px);
    background: #22222c; border: 1px solid #383848; color: #FFF; padding: 12px 16px;
    border-radius: 12px; font-size: 14px; display: flex; align-items: center; gap: 14px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4); z-index: 10001; opacity: 0; pointer-events: none;
    transition: all 0.25s ease; max-width: 90vw;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
  .toast button { background: none; border: none; color: var(--accent); font-weight: 700; cursor: pointer; font-size: 14px; font-family: 'Inter', sans-serif; }

  /* Pixel Flower Petal Animation */
  .pixel-petal {
    position: fixed;
    top: -15px;
    z-index: 1;
    pointer-events: none;
    user-select: none;
    width: 6px;
    height: 6px;
    image-rendering: pixelated;
    animation: pixelFall linear infinite;
  }
  @keyframes pixelFall {
    0% { transform: translateY(0) rotate(0deg) translateX(0); opacity: 0.85; }
    50% { transform: translateY(50vh) rotate(180deg) translateX(12px); opacity: 0.7; }
    100% { transform: translateY(105vh) rotate(360deg) translateX(-12px); opacity: 0; }
  }

  /* Pop-up Animation */
  @keyframes popIn {
    0% { transform: scale(0.8); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  /* Among Us Zigzag Chase Animation */
  .imposter-icon {
    cursor: pointer;
    transition: filter 0.2s ease;
  }
  .imposter-icon:hover {
    filter: drop-shadow(0 2px 5px rgba(255,69,58,0.8)) brightness(1.15);
  }
  .imposter-icon.fleeing {
    pointer-events: none;
  }

  /* Button reacts when the imposter reaches it */
  @keyframes impactSquish {
    0% { transform: scale(1); }
    25% { transform: scale(1.12, 0.86) rotate(-1.5deg); }
    55% { transform: scale(0.92, 1.08) rotate(1.5deg); }
    80% { transform: scale(1.04, 0.98); }
    100% { transform: scale(1); }
  }
  .start-btn.imposter-hit {
    animation: impactSquish 0.45s ease;
  }

  .poof-particle {
    position: fixed;
    pointer-events: none;
    z-index: 9998;
    will-change: transform, opacity;
    transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.3, 1), opacity 0.6s ease-out;
  }

  /* Watermark */
  .watermark {
    position: fixed;
    bottom: 8px;
    right: 12px;
    font-size: 10px;
    color: var(--text-muted);
    opacity: 0.5;
    z-index: 9999;
    pointer-events: none;
    letter-spacing: 0.5px;
  }

  .app-container {
    width: 100%;
    max-width: var(--max-w);
    margin: 0 auto;
    min-height: 100vh;
    padding: 20px 16px 100px; 
    display: flex;
    flex-direction: column;
    position: relative;
    z-index: 2;
  }

  /* Fullscreen Welcome Container */
  .welcome-container {
    padding: 0 !important;
    max-width: 100% !important;
    width: 100vw !important;
  }

  /* Responsive Scaling for Tablets and Desktops */
  @media (min-width: 768px) {
    :root {
      --max-w: 620px;
    }
    .app-container {
      padding: 36px 24px 120px;
    }
    .card {
      padding: 20px;
    }
    h1 {
      font-size: 28px !important;
    }
    .subtitle {
      font-size: 15px !important;
    }
    .hero-image {
      width: 260px !important;
      height: 260px !important;
    }
  }

  @media (min-width: 1200px) {
    :root {
      --max-w: 680px;
    }
  }

  /* Typography */
  h1 { font-size: 24px; font-weight: 700; text-align: center; margin: 10px 0 4px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
  .subtitle { text-align: center; color: var(--text-muted); font-size: 14px; margin-bottom: 24px; text-shadow: 0 1px 3px rgba(0,0,0,0.5); }
  
  /* Cards with Glassmorphism */
  .card {
    background: var(--bg-card);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 16px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow: 0 8px 32px rgba(0,0,0,0.2);
  }
  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    font-weight: 600;
    font-size: 15px;
  }
  .card-header .count { color: var(--text-muted); font-size: 13px; font-weight: 400; }

  /* --- Apple-style Liquid Glass upgrade, scoped to the setup screen --- */
  .setup-screen .card {
    position: relative;
    background: linear-gradient(180deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0.04) 100%), rgba(30, 30, 38, 0.42);
    backdrop-filter: blur(28px) saturate(180%);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
    border: 1px solid rgba(255,255,255,0.16);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.25) inset,
      0 8px 30px rgba(0,0,0,0.35),
      0 0 0 1px rgba(0,0,0,0.08);
    overflow: hidden;
  }
  /* faint top sheen sweep, purely decorative */
  .setup-screen .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.55), transparent);
  }
  .setup-screen h1,
  .setup-screen .subtitle {
    text-shadow: 0 2px 12px rgba(0,0,0,0.65);
  }
  .setup-screen .player-input-wrap {
    background: rgba(255,255,255,0.07);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.10);
  }
  .setup-screen .player-input-wrap:focus-within {
    background: rgba(255,255,255,0.11);
    box-shadow: 0 0 0 1px var(--accent), 0 0 16px rgba(255,159,10,0.25);
  }
  .setup-screen .chip {
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.10);
  }
  .setup-screen .chip.active {
    background: linear-gradient(180deg, rgba(255,159,10,0.55), rgba(204,126,0,0.55));
    border: 1px solid rgba(255,200,120,0.55);
    box-shadow: 0 2px 10px rgba(255,159,10,0.25);
  }
  .setup-screen .add-player-btn {
    background: rgba(255,255,255,0.03);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  .setup-screen .switch {
    background: rgba(0,0,0,0.35);
    backdrop-filter: blur(4px);
  }
  .setup-screen .bottom-bar {
    background: rgba(18,18,22,0.55);
    backdrop-filter: blur(24px) saturate(160%);
    -webkit-backdrop-filter: blur(24px) saturate(160%);
    border-top: 1px solid rgba(255,255,255,0.10);
  }
  .setup-screen .start-btn {
    background: linear-gradient(180deg, #FFB020, var(--accent));
    box-shadow: 0 1px 0 rgba(255,255,255,0.4) inset, 0 6px 18px rgba(255,159,10,0.35);
  }
  .setup-screen .player-idx {
    box-shadow: 0 1px 0 rgba(255,255,255,0.3) inset, 0 2px 8px rgba(0,0,0,0.3);
  }

  /* Player List */
  .player-list { display: flex; flex-direction: column; gap: 10px; }
  .player-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .player-idx {
    width: 38px; height: 38px;
    background: var(--accent-dark);
    color: #FFF;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 600;
    flex-shrink: 0;
    cursor: pointer;
    background-size: cover;
    background-position: center;
    position: relative;
    border: 2px solid transparent;
    transition: all 0.2s ease;
  }
  .player-idx:hover { border-color: var(--accent); transform: scale(1.05); }
  .player-idx .add-photo-icon {
    position: absolute; bottom: -2px; right: -2px; background: #333;
    border-radius: 50%; padding: 2px; width: 14px; height: 14px;
    display: flex; align-items: center; justify-content: center; font-size: 10px;
    transition: all 0.2s ease;
  }
  .player-idx:hover .add-photo-icon { background: var(--accent); color: #000; }

  .player-input-wrap {
    flex: 1;
    background: var(--bg-input);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    display: flex; align-items: center;
    transition: all 0.2s ease;
    border: 1px solid rgba(255,255,255,0.05);
  }
  .player-input-wrap:focus-within {
    box-shadow: 0 0 0 1px var(--accent);
    background: rgba(45, 45, 58, 0.95);
  }
  .player-input-wrap input {
    background: transparent; border: none; color: var(--text-main); font-size: 15px; width: 100%; outline: none; font-family: 'Inter', sans-serif;
  }
  .del-btn {
    background: none; border: none; color: var(--text-muted); padding: 5px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all 0.2s ease;
  }
  .del-btn:hover { color: var(--danger); transform: scale(1.15); }
  
  .add-player-btn {
    width: 100%; background: transparent; border: 1px dashed rgba(255,255,255,0.2); color: var(--text-muted); padding: 12px; border-radius: var(--radius-sm); margin-top: 10px; cursor: pointer; font-size: 15px; font-weight: 500;
    transition: all 0.2s ease;
  }
  .add-player-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(255, 159, 10, 0.05);
  }

  /* Settings Toggles */
  .setting-row {
    display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer;
    transition: background 0.2s ease;
    border-radius: 8px;
    margin: 0 -8px;
    padding: 12px 8px;
  }
  .setting-row:hover { background: rgba(255, 255, 255, 0.05); }
  .setting-row:last-child { border-bottom: none; }
  .setting-info { display: flex; gap: 12px; align-items: center; flex: 1; }
  .setting-icon { color: var(--accent); font-size: 18px; }
  .setting-text h3 { margin: 0; font-size: 15px; font-weight: 500; }
  .setting-text p { margin: 4px 0 0; font-size: 12px; color: var(--text-muted); }
  
  /* Toggle Switch */
  .switch {
    width: 44px; height: 24px; background: rgba(0,0,0,0.4); border-radius: 12px; position: relative; transition: 0.3s;
    border: 1px solid rgba(255,255,255,0.1);
  }
  .switch::after {
    content: ''; position: absolute; top: 1px; left: 2px; width: 20px; height: 20px; background: #FFF; border-radius: 50%; transition: 0.3s;
  }
  .switch.active { background: var(--accent); border-color: var(--accent); }
  .switch.active::after { transform: translateX(18px); }

  /* Bottom Bar */
  .bottom-bar {
    position: fixed; bottom: 0; left: 0; right: 0; padding: 16px; background: rgba(18, 18, 22, 0.85); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: center; z-index: 10;
  }
  .bottom-bar .inner { width: 100%; max-width: var(--max-w); }
  .start-btn {
    width: 100%; background: var(--accent); color: #000; font-weight: 600; font-size: 16px; padding: 16px; border: none; border-radius: var(--radius-sm); cursor: pointer; font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: all 0.2s ease;
  }
  .start-btn:hover:not(:disabled) {
    filter: brightness(1.1);
    transform: translateY(-2px);
    box-shadow: 0 4px 15px rgba(255, 159, 10, 0.3);
  }
  .start-btn:active { opacity: 0.8; transform: scale(0.98); box-shadow: none; }
  .start-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; filter: none; }

  /* Chips */
  .chip-container { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .chip { background: var(--bg-input); color: var(--text-muted); padding: 8px 14px; border-radius: 20px; font-size: 13px; cursor: pointer; transition: all 0.2s ease; border: 1px solid rgba(255,255,255,0.05); }
  .chip:hover:not(.active) { background: rgba(255,255,255,0.1); color: #FFF; }
  .chip.active { background: var(--accent-dark); color: #FFF; border: 1px solid var(--accent); }

  /* Admin Panel specific */
  .admin-box { background: var(--bg-card); padding: 20px; border-radius: var(--radius); margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.08); backdrop-filter: blur(12px);}
  .admin-input { width: 100%; padding: 12px; background: var(--bg-input); border: 1px solid rgba(255,255,255,0.1); color: #FFF; border-radius: 8px; margin-bottom: 10px; font-size: 16px; transition: border-color 0.2s;}
  .admin-input:focus { outline: none; border-color: var(--accent); }
  .admin-btn { background: var(--accent); color: #000; padding: 10px 16px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; transition: all 0.2s ease; }
  .admin-btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
  .admin-btn:active { transform: scale(0.96); }
  .admin-btn-secondary { background: var(--bg-input); color: #FFF; border: 1px solid #30303C; padding: 10px 16px; border-radius: 8px; cursor: pointer; width: 100%; font-size: 15px; font-weight: 500; transition: all 0.2s ease; }
  .admin-btn-secondary:hover { background: #2a2a36; border-color: var(--text-muted); }
  .admin-btn-secondary:active { transform: scale(0.98); }
  .word-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .word-chip { background: var(--bg-input); padding: 5px 10px; border-radius: 4px; font-size: 12px; display: flex; align-items: center; gap: 5px; transition: background 0.2s; border: 1px solid rgba(255,255,255,0.05); }
  .word-chip:hover { background: rgba(255,255,255,0.1); }
  .word-chip span { transition: transform 0.2s; display: inline-block; }
  .word-chip span:hover { transform: scale(1.2); }
  
  /* In-game screens */
  .game-screen { text-align: center; padding-top: 40px; }
  .card-3d-wrap { perspective: 1000px; width: 100%; height: 300px; margin: 30px 0; position: relative; }
  .card-3d { width: 100%; height: 100%; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), top 0.5s ease, opacity 0.5s ease; transform-style: preserve-3d; cursor: pointer; position: absolute; top:0; }
  .card-3d:hover:not(.flipped):not(.discarded) { transform: scale(1.02); }
  .card-3d.flipped { transform: rotateY(180deg); }
  .card-3d.discarded { top: 100%; opacity: 0; pointer-events: none; transform: rotateY(180deg) scale(0.8); }
  .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: var(--radius); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; border: 1px solid rgba(255,255,255,0.1); transition: box-shadow 0.3s ease; backdrop-filter: blur(15px); }
  .card-3d:hover .card-face { box-shadow: 0 8px 25px rgba(0,0,0,0.4); }
  .card-front { background: var(--bg-card); }
  .card-back { background: var(--bg-input); transform: rotateY(180deg); }
  .tap-hint { border: 1px dashed var(--text-muted); color: var(--text-muted); padding: 8px 12px; border-radius: 6px; font-size: 12px; margin-top: 20px; transition: 0.3s; background: rgba(0,0,0,0.3); }

  /* Voting UI */
  .vote-option { background: var(--bg-input); border: 2px solid rgba(255,255,255,0.05); padding: 16px; border-radius: var(--radius-sm); margin-bottom: 10px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; font-size: 16px; transition: all 0.2s ease; backdrop-filter: blur(8px); }
  .vote-option:hover:not(.selected) { background: rgba(255,255,255,0.1); transform: translateX(4px); }
  .vote-option.selected { border-color: var(--accent); background: rgba(204, 126, 0, 0.3); }
  .vote-radio { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--text-muted); transition: all 0.2s ease; }
  .vote-option.selected .vote-radio { border-color: var(--accent); background: var(--accent); box-shadow: inset 0 0 0 4px #3c2a12; }
  
  /* Overlay Modal */
  .overlay {
    display: none;
    position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); z-index: 10000;
    justify-content: center; align-items: center; padding: 20px;
  }
  .popup-box {
    background: var(--bg-card); border: 2px solid var(--accent); padding: 40px 20px;
    border-radius: 20px; text-align: center; width: 100%; max-width: 350px;
    animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    box-shadow: 0 10px 40px rgba(255, 159, 10, 0.2);
  }
</style>
</head>
<body>

<div class="watermark">powered by adruzz</div>
<div class="app-container" id="app"></div>

<!-- Happy Onam Modal -->
<div class="overlay" id="onamModal">
  <div class="popup-box">
    <div style="font-size: 50px; margin-bottom: 10px;">🌸</div>
    <h1 style="color: var(--accent); font-size: 32px; margin-top: 0;">Happy Onam!</h1>
    <p style="color: var(--text-muted); margin-bottom: 30px;">May this beautiful festival bring you joy, peace, and prosperity.</p>
    <button class="start-btn" onclick="closePopupAndStart()">Let's Play</button>
  </div>
</div>

<script>
/* ---------------- Explicit Firebase Cloud Sync ONLY ---------------- */

const DEFAULT_CATEGORIES = [
  "Funny", "Movies", "Characters", "Festivals", "Places", "Food", 
  "Bakery", "Household Items", "People", "Kerala Life", "Vehicles", 
  "College / School", "Gulf / NRI", "FIFA", "Bigg Boss", "Onam"
];

let PACKS = {};
DEFAULT_CATEGORIES.forEach(cat => PACKS[cat] = []);

// Initialize Firebase
const firebaseConfig = {
  apiKey: "AIzaSyAtvDrGOe_qR-5_tBPwIn0NYX7E_Z5s_v8",
  authDomain: "imposter-game-f8b23.firebaseapp.com",
  databaseURL: "https://imposter-game-f8b23-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "imposter-game-f8b23",
  storageBucket: "imposter-game-f8b23.firebasestorage.app",
  messagingSenderId: "1030539812185",
  appId: "1:1030539812185:web:fe4f8c322d222f70ac0048"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let syncError = null;

// Sync data securely via JSON String
db.ref('gameDataV2').on('value', (snapshot) => {
  const dataString = snapshot.val();
  if (dataString) {
    try {
      PACKS = JSON.parse(dataString);
    } catch (e) {
      console.error("Data Parse Error", e);
    }
    
    // Ensure standard categories exist
    DEFAULT_CATEGORIES.forEach(cat => {
      if (!PACKS[cat]) PACKS[cat] = [];
    });

    state.activeCategories = state.activeCategories.filter(c => DEFAULT_CATEGORIES.includes(c));
    
    if (['setup', 'admin', 'welcome'].includes(state.screen) || !window.location.hash) {
      render();
    }
  }
});

function syncToCloud(onSuccess) {
  const payload = JSON.stringify(PACKS);
  
  db.ref('gameDataV2').set(payload, (error) => {
    if (error) {
      alert("❌ SAVE FAILED!\n\nFirebase blocked the save. Make sure you clicked the blue 'Publish' button in your Firebase Rules.\n\nError details: " + error.message);
    } else {
      if (onSuccess) onSuccess();
    }
    renderAdminPanel(); 
  });
}

/* ---------------- Multiplayer State ---------------- */
function getMyPlayerId() {
  let id = localStorage.getItem('imposter_pid');
  if (!id) {
    id = 'p_' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
    localStorage.setItem('imposter_pid', id);
  }
  return id;
}

const mp = {
  myId: getMyPlayerId(),
  myName: localStorage.getItem('imposter_pname') || '',
  code: localStorage.getItem('imposter_room_code') || null,
  isHost: false,
  room: null,         // last known room snapshot from Firebase
  roomRef: null,
  listenerFn: null,
  votedThisRound: false,
  cardRevealed: false
};

function detachRoomListener() {
  if (mp.roomRef && mp.listenerFn) {
    mp.roomRef.off('value', mp.listenerFn);
  }
  mp.roomRef = null;
  mp.listenerFn = null;
}

function attachRoomListener(code, onUpdate) {
  detachRoomListener();
  mp.roomRef = db.ref('imposterRooms/' + code);
  mp.listenerFn = mp.roomRef.on('value', (snap) => {
    const val = snap.val();
    mp.room = val;
    if (!val) return; // room deleted
    onUpdate(val);
  });
}

function generateRoomCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // no confusing 0/O/1/I
  let code = '';
  for (let i = 0; i < 4; i++) code += chars[Math.floor(Math.random() * chars.length)];
  return code;
}

function mpPlayerList(room) {
  if (!room || !room.players) return [];
  return Object.keys(room.players)
    .map(id => ({ id, ...room.players[id] }))
    .sort((a, b) => (a.joinedAt || 0) - (b.joinedAt || 0));
}

// Once the game has actually started, a dropped connection (phone screen
// lock, tab backgrounding, brief signal loss) should NOT remove the player
// from the room -- only the lobby "leave" cleanup should do that. Call this
// as soon as a client sees status move past 'lobby'.
function cancelMyDisconnectHook() {
  if (!mp.code) return;
  db.ref(`imposterRooms/${mp.code}/players/${mp.myId}`).onDisconnect().cancel();
}

// If this device briefly dropped and its player node got removed before we
// managed to cancel the disconnect hook (e.g. very first update after a
// reconnect), rejoin using our cached name so ready/vote counts stay correct
// for everyone, including the host.
function healMyPlayerEntry(room) {
  if (!mp.code || !room || room.status === 'lobby') return;
  const iAmInGame = room.game && room.game.roles && room.game.roles[mp.myId] !== undefined;
  const iAmMissing = !room.players || !room.players[mp.myId];
  if (iAmInGame && iAmMissing) {
    db.ref(`imposterRooms/${mp.code}/players/${mp.myId}`).set({
      name: mp.myName, joinedAt: Date.now(), ready: room.status !== 'playing'
    });
  }
}

/* ---------------- Fun: Imposter zigzag chase into the Enter button ---------------- */
function spawnPoof(x, y) {
  const bits = ['💨', '✨', '💥', '⭐'];
  for (let i = 0; i < 8; i++) {
    const p = document.createElement('div');
    p.className = 'poof-particle';
    p.textContent = bits[Math.floor(Math.random() * bits.length)];
    p.style.left = x + 'px';
    p.style.top = y + 'px';
    p.style.fontSize = (10 + Math.random() * 12) + 'px';
    p.style.opacity = '1';
    p.style.transform = 'translate(-50%, -50%) scale(1)';
    document.body.appendChild(p);
    requestAnimationFrame(() => {
      const angle = Math.random() * Math.PI * 2;
      const dist = 26 + Math.random() * 38;
      p.style.transform = `translate(calc(-50% + ${Math.cos(angle) * dist}px), calc(-50% + ${Math.sin(angle) * dist}px)) scale(0.3) rotate(${(Math.random() * 160 - 80)}deg)`;
      p.style.opacity = '0';
    });
    setTimeout(() => p.remove(), 700);
  }
}

window.runAwayZigzag = (el) => {
  if (el.classList.contains('fleeing')) return;

  const target = document.querySelector('.start-btn');
  if (!target) return;

  el.classList.add('fleeing');

  const startRect = el.getBoundingClientRect();
  const startCx = startRect.left + startRect.width / 2;
  const startCy = startRect.top + startRect.height / 2;
  const targetRect = target.getBoundingClientRect();
  const targetCx = targetRect.left + targetRect.width / 2;
  const targetCy = targetRect.top + targetRect.height / 2;

  const deltaX = targetCx - startCx;
  const deltaY = targetCy - startCy;
  const distance = Math.hypot(deltaX, deltaY);
  const duration = Math.min(2200, Math.max(1100, distance * 2.4));

  // Build a jittery zigzag path: linear travel toward the button,
  // plus a perpendicular wiggle that shrinks as it gets close, plus a rocking tilt.
  const perpX = -deltaY / (distance || 1);
  const perpY = deltaX / (distance || 1);
  const zigzags = 6;

  const transformFrames = [];
  const steps = 24;
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    const eased = t * t * (3 - 2 * t); // smoothstep for overall travel
    const wiggleDecay = Math.pow(1 - t, 1.4);
    const wiggle = Math.sin(t * Math.PI * zigzags) * 34 * wiggleDecay;
    const x = deltaX * eased + perpX * wiggle;
    const y = deltaY * eased + perpY * wiggle;
    const rotate = Math.sin(t * Math.PI * zigzags) * 22 * wiggleDecay;
    const scale = 1 - eased * 0.72;
    const bob = Math.abs(Math.sin(t * Math.PI * zigzags * 1.5)) * 4 * wiggleDecay;
    transformFrames.push({
      transform: `translate(${x}px, ${y - bob}px) rotate(${rotate}deg) scale(${Math.max(scale, 0.22)})`
    });
  }

  const transformAnim = el.animate(transformFrames, {
    duration,
    easing: 'linear',
    fill: 'forwards',
    composite: 'add'
  });

  el.animate(
    [
      { opacity: 1, offset: 0 },
      { opacity: 1, offset: 0.82 },
      { opacity: 0, offset: 1 }
    ],
    { duration, fill: 'forwards' }
  );

  transformAnim.onfinish = () => {
    el.style.visibility = 'hidden';
    target.classList.add('imposter-hit');
    spawnPoof(targetCx, targetCy);
    if (navigator.vibrate) navigator.vibrate([30, 40, 30]);
    setTimeout(() => target.classList.remove('imposter-hit'), 450);
  };
};

function renderOnlineLobby() {

  attachRoomListener(mp.code, (room) => {

    if (room.status === 'playing') {

    } else if (room.status === 'interrogate') {

    } else if (room.status === 'results') {

    } else {
      drawOnlineLobby(room);
    }
  });
}

  app.innerHTML = `

          ${players.map((p, i) => `

window.copyRoomCode = () => {
  navigator.clipboard?.writeText(mp.code).then(() => showToast('Room code copied')).catch(() => {});
};

window.toggleMpCategory = (cat) => {
  if (!mp.isHost || !mp.room) return;
  const current = (mp.room.settings && mp.room.settings.activeCategories) || [];
  let next;
  if (current.includes(cat)) {
    if (current.length <= 1) return;
    next = current.filter(c => c !== cat);
  } else {
    next = [...current, cat];
  }
  db.ref(`imposterRooms/${mp.code}/settings/activeCategories`).set(next);
};

window.toggleMpSetting = (key) => {
  if (!mp.isHost || !mp.room) return;
  const cur = mp.room.settings ? !!mp.room.settings[key] : false;
  db.ref(`imposterRooms/${mp.code}/settings/${key}`).set(!cur);
};

window.setMpImposterCount = (n) => {
  if (!mp.isHost || !mp.room) return;
  const players = mpPlayerList(mp.room);
  const max = Math.max(1, players.length - 2);
  const clamped = Math.max(1, Math.min(max, n));
  db.ref(`imposterRooms/${mp.code}/settings/imposterCount`).set(clamped);
};

window.leaveRoom = () => {
  if (mp.code && mp.myId) {
    db.ref(`imposterRooms/${mp.code}/players/${mp.myId}`).remove();
  }
  detachRoomListener();
  mp.code = null;
  mp.isHost = false;
  localStorage.removeItem('imposter_room_code');
  window.location.hash = '#online';
};

window.startOnlineGame = () => {
  if (!mp.isHost || !mp.room) return;
  const room = mp.room;
  const players = mpPlayerList(room);
  if (players.length < 3) return;

  const settings = room.settings;
  const categoriesWithWords = settings.activeCategories.filter(cat => PACKS[cat] && PACKS[cat].length > 0);
  if (categoriesWithWords.length === 0) {
    return alert('All selected categories are empty! Add words in the Admin panel (/#admin) first.');
  }

  const category = categoriesWithWords[Math.floor(Math.random() * categoriesWithWords.length)];
  const wordList = PACKS[category];
  const wordIdx = Math.floor(Math.random() * wordList.length);
  const word = wordList[wordIdx];

  let hintWord = "";
  if (settings.showImposterHint && wordList.length > 1) {
    let hintIdx = wordIdx;
    while (hintIdx === wordIdx) hintIdx = Math.floor(Math.random() * wordList.length);
    hintWord = wordList[hintIdx];
  }

  const shuffled = [...players];
  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  const imposterCount = Math.max(1, Math.min(settings.imposterCount || 1, players.length - 2));
  const imposterIds = new Set(shuffled.slice(0, imposterCount).map(p => p.id));

  const roles = {};
  players.forEach(p => { roles[p.id] = imposterIds.has(p.id) ? 'imposter' : 'crew'; });

  const readyReset = {};
  players.forEach(p => { readyReset[p.id + '/ready'] = false; });

  db.ref(`imposterRooms/${mp.code}`).update({
    status: 'playing',
    game: { secretWord: word, secretCategory: category, imposterHintWord: hintWord, roles },
    votes: null,
    players: Object.fromEntries(players.map(p => [p.id, { name: p.name, joinedAt: p.joinedAt || 0, ready: false }]))
  });
};

window.handlePhotoUpload = (e, idx) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (event) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const size = 150; 
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      const minDim = Math.min(img.width, img.height);
      const startX = (img.width - minDim) / 2;
      const startY = (img.height - minDim) / 2;
      ctx.drawImage(img, startX, startY, minDim, minDim, 0, 0, size, size);
      state.photos[idx] = canvas.toDataURL('image/jpeg', 0.8);
      renderSetup();
    };
    img.src = event.target.result;
  };
  reader.readAsDataURL(file);
};

function startGame() {
  if (state.activeCategories.length === 0) return alert("Select at least one category.");

  if (categoriesWithWords.length === 0) {

  }
  
  const finalNames = state.names.map((n, i) => n.trim() || `Player ${i + 1}`);
  const category = categoriesWithWords[Math.floor(Math.random() * categoriesWithWords.length)];
  const wordList = PACKS[category];
  
  const wordIdx = Math.floor(Math.random() * wordList.length);
  const word = wordList[wordIdx];
  
  let hintWord = "";
  if (state.showImposterHint && wordList.length > 1) {
    let hintIdx = wordIdx;
    while(hintIdx === wordIdx) { hintIdx = Math.floor(Math.random() * wordList.length); }
    hintWord = wordList[hintIdx];
  }

  const indices = [...Array(finalNames.length).keys()];
  for (let i = indices.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [indices[i], indices[j]] = [indices[j], indices[i]];
  }
  
  const imposterSet = new Set(indices.slice(0, state.imposterCount));

  state.players = finalNames.map((name, i) => ({
    name,
    photo: state.photos[i], 
    role: imposterSet.has(i) ? 'imposter' : 'crew'
  }));
  
  state.secretWord = word;
  state.secretCategory = category;
  state.imposterHintWord = hintWord;
  
  state.currentIndex = 0;
  state.votes = {};
  
  window.location.hash = '#play';
}

window.toggleBulkAdd = (cat) => {
  const box = document.getElementById('bulkAddBox');
  const toggle = document.getElementById('bulkToggle');
  const show = box.style.display === 'none';
  box.style.display = show ? 'block' : 'none';
  toggle.textContent = show ? '− Hide bulk add' : '+ Add multiple words at once';
  if (show) document.getElementById('bulkWords').focus();
};

window.addWord = (cat) => {
  const input = document.getElementById('newWord');
  const btn = document.getElementById('addWordBtn');
  const val = input.value.trim();
  if (!val) return;

  const existingLower = (PACKS[cat] || []).map(w => w.toLowerCase());
  if (existingLower.includes(val.toLowerCase())) {
    showToast(`"${val}" is already in this category`);
    return;
  }

  input.value = '';
  btn.disabled = true;
  btn.textContent = 'Saving...';

  if(!PACKS[cat]) PACKS[cat] = [];
  PACKS[cat].push(val); 
  
  syncToCloud(() => {
     document.getElementById('newWord').value = '';
  });
};

window.addBulkWords = (cat) => {
  const textarea = document.getElementById('bulkWords');
  const btn = document.getElementById('bulkAddBtn');
  const raw = textarea.value;
  const candidates = raw.split(/[\n,]/).map(w => w.trim()).filter(Boolean);
  if (candidates.length === 0) return;

  btn.disabled = true;
  btn.textContent = 'Saving...';

  const existingLower = (PACKS[cat] || []).map(w => w.toLowerCase());
  let added = 0, skipped = 0;
  candidates.forEach(w => {
    if (existingLower.includes(w.toLowerCase())) { skipped++; return; }
    PACKS[cat].push(w);
    existingLower.push(w.toLowerCase());
    added++;
  });
  
  syncToCloud(() => {
    textarea.value = '';
    showToast(`Added ${added} word${added !== 1 ? 's' : ''}${skipped ? `, skipped ${skipped} duplicate${skipped !== 1 ? 's' : ''}` : ''}`);
    btn.disabled = false;
    btn.textContent = 'Add All';
  });
};

window.deleteWord = (cat, idx) => {
  const confirmDelete = confirm("Delete this word?");
  if (confirmDelete) {
    PACKS[cat].splice(idx, 1); 
    syncToCloud();
  }
};

window.factoryReset = () => {
  if (confirm("Reset all words to default (empty)? Custom words will be lost.")) {
    PACKS = {};
    DEFAULT_CATEGORIES.forEach(cat => PACKS[cat] = []);
    syncToCloud();
  }
};

            ` : `

              <h2 style="font-size:32px; margin:0; color:var(--accent);">${escapeHtml(state.secretWord)}</h2>

  let viewsLeft = 2;

  card.addEventListener('click', () => {

      viewsLeft--;
      card.classList.add('flipped');
      nextBtn.style.display = 'none'; 
    } else {
      isRevealed = false;
      card.classList.remove('flipped');
      if (viewsLeft > 0) {
        frontHint.innerText = `TAP TO REVEAL (${viewsLeft} VIEW LEFT)`;
      } else {
        frontHint.innerText = `FILE LOCKED (0 VIEWS LEFT)`;
        frontHint.style.borderColor = 'var(--danger)';
        frontHint.style.color = 'var(--danger)';
      }
      nextBtn.style.display = 'flex'; 
    }
  });

  nextBtn.addEventListener('click', () => {
    if (hasDiscarded) return;
    hasDiscarded = true;
    card.classList.add('discarded');
    setTimeout(() => {
      if (state.currentIndex < total - 1) {
        state.currentIndex++;
        renderPass();
      } else {
        window.location.hash = '#interrogate';
      }
    }, 500); 
  });

  cancelBtn.addEventListener('click', () => {
    if (confirm('Cancel round?')) {
      window.location.hash = '#setup';
    }
  });
}

/* ---------------- 4. Interrogation ---------------- */
let timerInterval = null;
let timerSeconds = 0;
let timerRunning = false;

function renderInterrogate() {
  app.innerHTML = `
    <div class="game-screen" style="padding-top:20px;">
      <div style="font-size:50px; margin-bottom:10px;">💬</div>
      <h1>Interrogation Phase</h1>
      <p class="subtitle" style="margin-bottom:30px;">Discuss and figure out who is lying.</p>

      <div class="card" style="padding: 20px; text-align:center;">
        <div style="font-size:12px; color:var(--text-muted); font-weight:600; letter-spacing:1px; margin-bottom:10px;">DISCUSSION TIMER</div>
        <div id="timerDisplay" style="font-size:48px; font-weight:800; font-variant-numeric:tabular-nums; color:${timerSeconds === 0 && !timerRunning ? 'var(--text-main)' : 'var(--accent)'}; text-shadow: 0 2px 5px rgba(0,0,0,0.5);">${formatTimer(timerSeconds)}</div>
        <div style="display:flex; gap:8px; justify-content:center; margin-top:14px; flex-wrap:wrap;">
          ${!timerRunning ? `
            <button class="admin-btn-secondary" style="width:auto; padding:8px 14px;" onclick="setTimerPreset(60)">1 min</button>
            <button class="admin-btn-secondary" style="width:auto; padding:8px 14px;" onclick="setTimerPreset(180)">3 min</button>
            <button class="admin-btn-secondary" style="width:auto; padding:8px 14px;" onclick="setTimerPreset(300)">5 min</button>
          ` : ''}
        </div>
        <div style="display:flex; gap:10px; margin-top:14px;">
          <button class="admin-btn" style="flex:1;" onclick="toggleTimer()">${timerRunning ? 'Pause' : (timerSeconds > 0 ? 'Resume' : 'Start')}</button>
          <button class="admin-btn-secondary" style="flex:1;" onclick="resetTimer()">Reset</button>
        </div>
      </div>

      <div class="card" style="padding: 20px; text-align: left;">
        <h3 style="margin-top:0; font-size: 16px;">Next Step: Secret Voting</h3>
        <p style="color: var(--text-muted); font-size: 14px; line-height: 1.5; margin-bottom: 0;">Once the discussion is over, pass the device around again so everyone can secretly cast their vote for the suspected Imposter.</p>
      </div>

      <button class="start-btn" onclick="startVotingPhase()">
        Start Voting Phase
      </button>
    </div>
  `;
}

function formatTimer(sec) {
  const m = Math.floor(sec / 60).toString().padStart(2, '0');
  const s = (sec % 60).toString().padStart(2, '0');
  return `${m}:${s}`;
}

window.setTimerPreset = (sec) => {
  timerSeconds = sec;
  const el = document.getElementById('timerDisplay');
  if (el) { el.textContent = formatTimer(timerSeconds); el.style.color = 'var(--accent)'; }
  renderInterrogate();
};

window.toggleTimer = () => {
  if (timerRunning) {
    clearInterval(timerInterval);
    timerRunning = false;
    renderInterrogate();
    return;
  }
  if (timerSeconds <= 0) timerSeconds = 180;
  timerRunning = true;
  renderInterrogate();
  timerInterval = setInterval(() => {
    timerSeconds--;
    const el = document.getElementById('timerDisplay');
    if (el) el.textContent = formatTimer(Math.max(timerSeconds, 0));
    if (timerSeconds <= 0) {
      clearInterval(timerInterval);
      timerRunning = false;
      if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 200]);
      renderInterrogate();
    }
  }, 1000);
};

window.resetTimer = () => {
  clearInterval(timerInterval);
  timerRunning = false;
  timerSeconds = 0;
  renderInterrogate();
};

function startVotingPhase() {
  clearInterval(timerInterval);
  timerRunning = false;
  timerSeconds = 0;
  state.currentIndex = 0;
  state.votes = {};
  window.location.hash = '#vote-pass';
}

/* ---------------- 5. Voting Phase ---------------- */
function renderVotePass() {
  const p = state.players[state.currentIndex];
  app.innerHTML = `
    <div class="game-screen" style="padding-top:60px;">
      <div class="subtitle">Voting phase: ${state.currentIndex + 1} / ${state.players.length}</div>
      ${p.photo ? `<img src="${p.photo}" style="width:100px; height:100px; border-radius:50%; object-fit:cover; margin: 20px auto 10px; border:3px solid var(--accent); display:block; box-shadow: 0 4px 15px rgba(0,0,0,0.5);">` : ''}
      <h1 style="font-size:30px; margin-bottom: 30px;">Pass to <span style="color:var(--accent)">${escapeHtml(p.name)}</span></h1>
      <p style="color:var(--text-muted); font-size:14px; margin-bottom:40px;">Make sure no one else is looking before you continue.</p>
      
      <button class="start-btn" onclick="window.location.hash='#vote-cast'">
        I am ${escapeHtml(p.name)}
      </button>
    </div>
  `;
}

function renderVoteCast() {
  state.selectedVoteIndex = null;
  
  let optionsHTML = state.players.map((p, i) => {
    if (i === state.currentIndex) return ''; 
    const avatar = p.photo 
      ? `<img src="${p.photo}" style="width:32px; height:32px; border-radius:50%; object-fit:cover;">` 
      : `<div style="width:32px; height:32px; border-radius:50%; background:var(--accent-dark); display:flex; align-items:center; justify-content:center; font-size:12px; color:#FFF; font-weight:bold;">${i+1}</div>`;
      
    return `
      <div class="vote-option" id="vote-opt-${i}" onclick="selectVote(${i})">
        <div style="display:flex; align-items:center; gap:12px;">
          ${avatar}
          <span>${escapeHtml(p.name)}</span>
        </div>
        <div class="vote-radio"></div>
      </div>
    `;
  }).join('');

  app.innerHTML = `
    <div style="padding-top:20px;">
      <h2 style="margin-bottom:5px;">Who is the Imposter?</h2>
      <p class="subtitle" style="text-align:left; margin-bottom:20px;">Secretly select a player to eliminate.</p>
      
      <div style="margin-bottom: 80px;">
        ${optionsHTML}
      </div>

      <div class="bottom-bar">
        <div class="inner">
          <button class="start-btn" id="confirmVoteBtn" disabled onclick="submitVote()">
            Confirm Vote
          </button>
        </div>
      </div>
    </div>
  `;
}

window.selectVote = (idx) => {
  state.selectedVoteIndex = idx;
  document.querySelectorAll('.vote-option').forEach(el => el.classList.remove('selected'));
  document.getElementById(`vote-opt-${idx}`).classList.add('selected');
  document.getElementById('confirmVoteBtn').disabled = false;
};

window.submitVote = () => {
  if (state.selectedVoteIndex === null) return;
  state.votes[state.currentIndex] = state.selectedVoteIndex;
  
  if (state.currentIndex < state.players.length - 1) {
    state.currentIndex++;
    window.location.hash = '#vote-pass';
  } else {
    window.location.hash = '#results';
  }
};

/* ---------------- 6. Results ---------------- */
function renderResults() {
  const voteCounts = {};
  Object.values(state.votes).forEach(votedIdx => {
    voteCounts[votedIdx] = (voteCounts[votedIdx] || 0) + 1;
  });

  let maxVotes = 0;
  for (let idx in voteCounts) {
    if (voteCounts[idx] > maxVotes) maxVotes = voteCounts[idx];
  }

  const eliminatedIndices = Object.keys(voteCounts)
    .map(Number)
    .filter(idx => voteCounts[idx] === maxVotes);
    
  const imposters = state.players.filter(p => p.role === 'imposter');
  const imposterIndices = state.players.map((p, i) => p.role === 'imposter' ? i : -1).filter(i => i !== -1);
  
  const imposterCaught = eliminatedIndices.some(idx => imposterIndices.includes(idx));
  
  let outcomeHTML = "";
  if (eliminatedIndices.length > 1) {
    outcomeHTML = `<h1 style="color:var(--accent)">Voting Tied!</h1>
                   <p style="color:var(--text-muted); margin-top:5px;">${eliminatedIndices.map(i => escapeHtml(state.players[i].name)).join(' and ')} tied with ${maxVotes} votes. The imposter survived!</p>`;
  } else if (imposterCaught) {
    outcomeHTML = `<h1 style="color:var(--success)">Imposter Caught!</h1>
                   <p style="color:var(--text-muted); margin-top:5px;">Crew wins! ${escapeHtml(state.players[eliminatedIndices[0]].name)} was voted out.</p>`;
  } else {
    outcomeHTML = `<h1 style="color:var(--danger)">Crew Failed!</h1>
                   <p style="color:var(--text-muted); margin-top:5px;">${escapeHtml(state.players[eliminatedIndices[0]].name)} was innocent! The imposter survives.</p>`;
  }

  app.innerHTML = `
    <div class="game-screen" style="padding-top:20px; padding-bottom:40px;">
      <div style="color:var(--text-muted); font-size:12px; font-weight:700; letter-spacing:2px; margin-bottom:10px;">CASE CLOSED</div>
      
      <div style="animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);">${outcomeHTML}</div>
      
      <div class="card" style="padding: 20px; margin: 30px 0;">
        <div style="font-size:12px; color:var(--text-muted); margin-bottom:5px;">THE WORD WAS</div>
        <div style="font-size:24px; color:var(--accent); font-weight:700; text-transform:uppercase;">${escapeHtml(state.secretWord)}</div>
        <div style="font-size:12px; color:var(--text-muted); margin-top:10px;">ACTUAL IMPOSTER: <b style="color:var(--danger)">${imposters.map(i => escapeHtml(i.name)).join(', ')}</b></div>
      </div>
      
      <div style="text-align:left; margin-bottom:10px; font-weight:600; font-size: 15px;">Voting Breakdown</div>
      <div class="player-list" style="text-align:left; margin-bottom:40px;">
        ${state.players.map((p, i) => {
          const votesReceived = voteCounts[i] || 0;
          const isEliminated = eliminatedIndices.includes(i);
          const avatar = p.photo 
            ? `<img src="${p.photo}" style="width:32px; height:32px; border-radius:50%; object-fit:cover;">` 
            : `<div style="width:32px; height:32px; border-radius:50%; background:var(--accent-dark); display:flex; align-items:center; justify-content:center; font-size:12px; color:#FFF; font-weight:bold;">${i+1}</div>`;
            
          return `
            <div class="player-row" style="background:${isEliminated ? 'rgba(255, 69, 58, 0.2)' : 'var(--bg-card)'}; border: 1px solid ${isEliminated ? 'var(--danger)' : 'rgba(255,255,255,0.05)'}; padding:12px; border-radius:8px; justify-content:space-between; backdrop-filter: blur(8px);">
              <div style="display:flex; align-items:center; gap:12px;">
                ${avatar}
                <div style="display:flex; flex-direction:column;">
                  <span style="font-weight:${isEliminated ? '700' : '400'}">${escapeHtml(p.name)}</span>
                  ${p.role === 'imposter' ? `<span style="font-size:11px; color:var(--danger); margin-top:2px;">(Imposter)</span>` : ''}
                </div>
              </div>
              <div style="font-size:13px; color:var(--text-muted);">
                ${votesReceived} vote${votesReceived !== 1 ? 's' : ''}
              </div>
            </div>
          `;
        }).join('')}
      </div>

      <button class="start-btn" style="margin-bottom:10px;" onclick="startGame()">Same Roster, New Word</button>
      <button class="admin-btn-secondary" style="width:100%" onclick="window.location.hash='#setup'">New Setup</button>
    </div>
  `;

  startResultsBurst(imposterCaught && eliminatedIndices.length === 1);
}

function startResultsBurst(crewWon) {
  const emojis = crewWon ? ['🎉', '✨', '🎊', '👏'] : ['😈', '🕵️', '💀', '🔥'];
  for (let i = 0; i < 20; i++) {
    let el = document.createElement('div');
    el.className = 'pixel-petal';
    el.innerText = emojis[Math.floor(Math.random() * emojis.length)];
    el.style.left = Math.random() * 100 + 'vw';
    el.style.animationDuration = (Math.random() * 2 + 2.5) + 's';
    el.style.animationDelay = (Math.random() * 0.6) + 's';
    el.style.fontSize = (Math.random() * 12 + 14) + 'px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 5000);
  }
}

/* ---------------- Online Play (each device shows only its own role) ---------------- */
function renderOnlinePlay() {
  if (!mp.code) { window.location.hash = '#online'; return; }
  mp.cardRevealed = false;

  attachRoomListener(mp.code, (room) => {
    mp.isHost = (room.hostId === mp.myId);
    cancelMyDisconnectHook();
    healMyPlayerEntry(room);
    if (room.status === 'interrogate') { window.location.hash = '#online-interrogate'; return; }
    if (room.status === 'voting') { window.location.hash = '#online-vote'; return; }
    if (room.status === 'results') { window.location.hash = '#online-results'; return; }
    if (room.status === 'lobby') { window.location.hash = '#online-lobby'; return; }
    drawOnlinePlay(room);
  });
}

function drawOnlinePlay(room) {
  const game = room.game;
  if (!game) return;
  const players = mpPlayerList(room);
  const myRole = game.roles[mp.myId];
  const readyCount = players.filter(p => p.ready).length;
  const iAmReady = !!(room.players[mp.myId] && room.players[mp.myId].ready);

  app.innerHTML = `
    <div class="game-screen">
      <div class="subtitle">Your secret briefing</div>

      <div class="card-3d-wrap" style="height:280px;">
        <div class="card-3d ${mp.cardRevealed ? 'flipped' : ''}" id="activeCard">
          <div class="card-face card-front">
            <div style="color:var(--accent); font-weight:600; font-size:12px; letter-spacing:2px;">CLASSIFIED</div>
            <h2 style="font-size:26px; margin:10px 0;">${escapeHtml(mp.myName)}</h2>
            <div class="tap-hint">TAP TO REVEAL</div>
          </div>
          <div class="card-face card-back">
            ${myRole === 'imposter' ? `
              <div style="color:var(--danger); font-size:12px; font-weight:700; letter-spacing:2px; margin-bottom:10px;">STATUS</div>
              <h2 style="color:var(--danger); font-size:28px; margin:0; line-height:1.2;">You Are<br>The Imposter</h2>
              ${room.settings.imposterSeesCategory ? `<div style="margin-top:10px; font-size:14px; color:var(--text-muted);">Category:<br><b style="color:var(--text-main)">${escapeHtml(game.secretCategory)}</b></div>` : ''}
              ${room.settings.showImposterHint && game.imposterHintWord ? `<div style="margin-top:5px; font-size:14px; color:var(--text-muted);">Fake Hint Word:<br><b style="color:var(--accent)">${escapeHtml(game.imposterHintWord)}</b></div>` : ''}
            ` : `
              <div style="color:var(--text-muted); font-size:12px; font-weight:700; letter-spacing:2px; margin-bottom:10px;">THE SECRET WORD</div>
              <h2 style="font-size:28px; margin:0; color:var(--accent);">${escapeHtml(game.secretWord)}</h2>
              <div style="margin-top:20px; font-size:14px; color:var(--text-muted);">Category: <b style="color:var(--text-main)">${escapeHtml(game.secretCategory)}</b></div>
            `}
            <div class="tap-hint" style="margin-top:15px; border-color:var(--text-muted); color:var(--text-muted);">TAP TO HIDE</div>
          </div>
        </div>
      </div>

      <p style="color:var(--text-muted); font-size:12px; margin-top:10px;">Only you can see this on your own device.</p>

      <button class="start-btn" style="margin-top:20px;" ${iAmReady ? 'disabled' : ''} onclick="markMpReady()">
        ${iAmReady ? `Waiting for others (${readyCount}/${players.length})` : "I've Seen My Card — Ready"}
      </button>

      ${mp.isHost ? `<button class="admin-btn-secondary" style="margin-top:10px;" onclick="forceStartInterrogation()">Skip Waiting — Start Discussion</button>` : ''}
    </div>
  `;

  const card = document.getElementById('activeCard');
  card.addEventListener('click', () => {
    mp.cardRevealed = !mp.cardRevealed;
    card.classList.toggle('flipped');
  });
}

window.markMpReady = () => {
  db.ref(`imposterRooms/${mp.code}/players/${mp.myId}/ready`).set(true).then(() => {
    // Whoever ends up being the last to ready re-reads fresh from the
    // server (not the local cache) before advancing the phase, so a stale
    // snapshot can't trigger an early jump -- and it isn't limited to only
    // the host's own click triggering the check.
    db.ref(`imposterRooms/${mp.code}/players`).once('value', (snap) => {
      const players = snap.val() || {};
      const ids = Object.keys(players);
      const allReady = ids.length > 0 && ids.every(id => players[id].ready);
      if (allReady) {
        db.ref(`imposterRooms/${mp.code}/status`).set('interrogate');
      }
    });
  });
};

window.forceStartInterrogation = () => {
  if (!mp.isHost) return;
  if (!confirm('Some players may not have seen their card yet. Start discussion anyway?')) return;
  db.ref(`imposterRooms/${mp.code}/status`).set('interrogate');
};

/* ---------------- Online Interrogation (synced timer) ---------------- */
let mpTimerRAF = null;
function renderOnlineInterrogate() {
  if (!mp.code) { window.location.hash = '#online'; return; }

  attachRoomListener(mp.code, (room) => {
    mp.isHost = (room.hostId === mp.myId);
    cancelMyDisconnectHook();
    healMyPlayerEntry(room);
    if (room.status === 'voting') { window.location.hash = '#online-vote'; return; }
    if (room.status === 'results') { window.location.hash = '#online-results'; return; }
    drawOnlineInterrogate(room);
  });
}

function drawOnlineInterrogate(room) {
  const timer = room.timer || { seconds: 0, running: false, endTime: null };
  let remaining = timer.seconds || 0;
  if (timer.running && timer.endTime) {
    remaining = Math.max(0, Math.round((timer.endTime - Date.now()) / 1000));
  }

  app.innerHTML = `
    <div class="game-screen" style="padding-top:20px;">
      <div style="font-size:50px; margin-bottom:10px;">💬</div>
      <h1>Interrogation Phase</h1>
      <p class="subtitle" style="margin-bottom:30px;">Discuss out loud and figure out who's lying.</p>

      <div class="card" style="padding: 20px; text-align:center;">
        <div style="font-size:12px; color:var(--text-muted); font-weight:600; letter-spacing:1px; margin-bottom:10px;">DISCUSSION TIMER</div>
        <div id="mpTimerDisplay" style="font-size:48px; font-weight:800; font-variant-numeric:tabular-nums; color:var(--accent); text-shadow: 0 2px 5px rgba(0,0,0,0.5);">${formatTimer(remaining)}</div>
        ${mp.isHost ? `
          <div style="display:flex; gap:8px; justify-content:center; margin-top:14px; flex-wrap:wrap;">
            ${!timer.running ? `
              <button class="admin-btn-secondary" style="width:auto; padding:8px 14px;" onclick="setMpTimerPreset(60)">1 min</button>
              <button class="admin-btn-secondary" style="width:auto; padding:8px 14px;" onclick="setMpTimerPreset(180)">3 min</button>
              <button class="admin-btn-secondary" style="width:auto; padding:8px 14px;" onclick="setMpTimerPreset(300)">5 min</button>
            ` : ''}
          </div>
          <div style="display:flex; gap:10px; margin-top:14px;">
            <button class="admin-btn" style="flex:1;" onclick="toggleMpTimer()">${timer.running ? 'Pause' : (remaining > 0 ? 'Resume' : 'Start')}</button>
            <button class="admin-btn-secondary" style="flex:1;" onclick="resetMpTimer()">Reset</button>
          </div>
        ` : `<p style="color:var(--text-muted); font-size:12px; margin-top:10px;">Only the host controls the timer.</p>`}
      </div>

      ${mp.isHost ? `
        <button class="start-btn" onclick="startMpVoting()">Start Voting Phase</button>
      ` : `
        <div class="card" style="text-align:center; color:var(--text-muted);">Waiting for host to start voting...</div>
      `}
    </div>
  `;

  cancelAnimationFrame(mpTimerRAF);
  if (timer.running) {
    const tick = () => {
      const el = document.getElementById('mpTimerDisplay');
      if (!el) return;
      const rem = Math.max(0, Math.round((timer.endTime - Date.now()) / 1000));
      el.textContent = formatTimer(rem);
      if (rem > 0) mpTimerRAF = requestAnimationFrame(tick);
      else if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
    };
    mpTimerRAF = requestAnimationFrame(tick);
  }
}

window.setMpTimerPreset = (sec) => {
  if (!mp.isHost) return;
  db.ref(`imposterRooms/${mp.code}/timer`).set({ seconds: sec, running: false, endTime: null });
};

window.toggleMpTimer = () => {
  if (!mp.isHost || !mp.room) return;
  const timer = mp.room.timer || { seconds: 180, running: false };
  if (timer.running) {
    const remaining = Math.max(0, Math.round((timer.endTime - Date.now()) / 1000));
    db.ref(`imposterRooms/${mp.code}/timer`).set({ seconds: remaining, running: false, endTime: null });
  } else {
    const secs = timer.seconds > 0 ? timer.seconds : 180;
    db.ref(`imposterRooms/${mp.code}/timer`).set({ seconds: secs, running: true, endTime: Date.now() + secs * 1000 });
  }
};

window.resetMpTimer = () => {
  if (!mp.isHost) return;
  db.ref(`imposterRooms/${mp.code}/timer`).set({ seconds: 0, running: false, endTime: null });
};

window.startMpVoting = () => {
  if (!mp.isHost) return;
  db.ref(`imposterRooms/${mp.code}`).update({ status: 'voting', votes: null });
};

/* ---------------- Online Voting ---------------- */
function renderOnlineVote() {
  if (!mp.code) { window.location.hash = '#online'; return; }
  mp.votedThisRound = false;

  attachRoomListener(mp.code, (room) => {
    mp.isHost = (room.hostId === mp.myId);
    cancelMyDisconnectHook();
    healMyPlayerEntry(room);
    if (room.status === 'results') { window.location.hash = '#online-results'; return; }
    drawOnlineVote(room);
  });
}

function drawOnlineVote(room) {
  const players = mpPlayerList(room);
  const votes = room.votes || {};
  const myVote = votes[mp.myId];
  const votesIn = Object.keys(votes).length;

  if (myVote !== undefined) {
    app.innerHTML = `
      <div class="game-screen" style="padding-top:60px;">
        <h1>Vote Cast</h1>
        <p class="subtitle">Waiting for other players... (${votesIn}/${players.length})</p>
        ${mp.isHost ? `<button class="start-btn" style="margin-top:30px;" onclick="finishMpVoting()">Finish Voting Now</button>` : ''}
      </div>
    `;
    return;
  }

  let optionsHTML = players.map((p) => {
    if (p.id === mp.myId) return '';
    return `
      <div class="vote-option" id="vote-opt-${p.id}" onclick="selectMpVote('${p.id}')">
        <div style="display:flex; align-items:center; gap:12px;">
          <div style="width:32px; height:32px; border-radius:50%; background:var(--accent-dark); display:flex; align-items:center; justify-content:center; font-size:12px; color:#FFF; font-weight:bold;">${escapeHtml(p.name[0] || '?')}</div>
          <span>${escapeHtml(p.name)}</span>
        </div>
        <div class="vote-radio"></div>
      </div>
    `;
  }).join('');

  app.innerHTML = `
    <div style="padding-top:20px;">
      <h2 style="margin-bottom:5px;">Who is the Imposter?</h2>
      <p class="subtitle" style="text-align:left; margin-bottom:20px;">Select a player to eliminate.</p>
      <div style="margin-bottom: 80px;">${optionsHTML}</div>
      <div class="bottom-bar">
        <div class="inner">
          <button class="start-btn" id="confirmMpVoteBtn" disabled onclick="submitMpVote()">Confirm Vote</button>
        </div>
      </div>
    </div>
  `;
}

let mpSelectedVote = null;
window.selectMpVote = (id) => {
  mpSelectedVote = id;
  document.querySelectorAll('.vote-option').forEach(el => el.classList.remove('selected'));
  document.getElementById(`vote-opt-${id}`).classList.add('selected');
  document.getElementById('confirmMpVoteBtn').disabled = false;
};

window.submitMpVote = () => {
  if (!mpSelectedVote) return;
  db.ref(`imposterRooms/${mp.code}/votes/${mp.myId}`).set(mpSelectedVote).then(() => {
    // Re-read both votes and the current player roster fresh from the
    // server -- whoever happens to be last to vote triggers the advance,
    // using live counts instead of a possibly-stale local snapshot.
    Promise.all([
      db.ref(`imposterRooms/${mp.code}/votes`).once('value'),
      db.ref(`imposterRooms/${mp.code}/players`).once('value')
    ]).then(([votesSnap, playersSnap]) => {
      const votes = votesSnap.val() || {};
      const players = playersSnap.val() || {};
      const totalPlayers = Object.keys(players).length;
      if (totalPlayers > 0 && Object.keys(votes).length >= totalPlayers) {
        db.ref(`imposterRooms/${mp.code}/status`).set('results');
      }
    });
  });
};

window.finishMpVoting = () => {
  if (!mp.isHost) return;
  if (!confirm('Some players may not have voted yet. Reveal results anyway?')) return;
  db.ref(`imposterRooms/${mp.code}/status`).set('results');
};

/* ---------------- Online Results ---------------- */
function renderOnlineResults() {
  if (!mp.code) { window.location.hash = '#online'; return; }

  attachRoomListener(mp.code, (room) => {
    mp.isHost = (room.hostId === mp.myId);
    cancelMyDisconnectHook();
    if (room.status === 'playing') { window.location.hash = '#online-play'; return; }
    if (room.status === 'lobby') { window.location.hash = '#online-lobby'; return; }
    drawOnlineResults(room);
  });
}

function drawOnlineResults(room) {
  const players = mpPlayerList(room);
  const votes = room.votes || {};
  const game = room.game;

  const voteCounts = {};
  Object.values(votes).forEach(votedId => { voteCounts[votedId] = (voteCounts[votedId] || 0) + 1; });

  let maxVotes = 0;
  for (let id in voteCounts) if (voteCounts[id] > maxVotes) maxVotes = voteCounts[id];

  const eliminatedIds = Object.keys(voteCounts).filter(id => voteCounts[id] === maxVotes);
  const imposterIds = players.filter(p => game.roles[p.id] === 'imposter').map(p => p.id);
  const imposterCaught = eliminatedIds.some(id => imposterIds.includes(id));
  const nameOf = (id) => { const p = players.find(pl => pl.id === id); return p ? p.name : '?'; };

  let outcomeHTML = "";
  if (maxVotes === 0) {
    outcomeHTML = `<h1 style="color:var(--accent)">No Votes Cast</h1><p style="color:var(--text-muted); margin-top:5px;">The imposter survived!</p>`;
  } else if (eliminatedIds.length > 1) {
    outcomeHTML = `<h1 style="color:var(--accent)">Voting Tied!</h1><p style="color:var(--text-muted); margin-top:5px;">${eliminatedIds.map(nameOf).map(escapeHtml).join(' and ')} tied with ${maxVotes} votes. The imposter survived!</p>`;
  } else if (imposterCaught) {
    outcomeHTML = `<h1 style="color:var(--success)">Imposter Caught!</h1><p style="color:var(--text-muted); margin-top:5px;">Crew wins! ${escapeHtml(nameOf(eliminatedIds[0]))} was voted out.</p>`;
  } else {
    outcomeHTML = `<h1 style="color:var(--danger)">Crew Failed!</h1><p style="color:var(--text-muted); margin-top:5px;">${escapeHtml(nameOf(eliminatedIds[0]))} was innocent! The imposter survives.</p>`;
  }

  app.innerHTML = `
    <div class="game-screen" style="padding-top:20px; padding-bottom:40px;">
      <div style="color:var(--text-muted); font-size:12px; font-weight:700; letter-spacing:2px; margin-bottom:10px;">CASE CLOSED</div>
      <div style="animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);">${outcomeHTML}</div>

      <div class="card" style="padding: 20px; margin: 30px 0;">
        <div style="font-size:12px; color:var(--text-muted); margin-bottom:5px;">THE WORD WAS</div>
        <div style="font-size:24px; color:var(--accent); font-weight:700; text-transform:uppercase;">${escapeHtml(game.secretWord)}</div>
        <div style="font-size:12px; color:var(--text-muted); margin-top:10px;">ACTUAL IMPOSTER: <b style="color:var(--danger)">${imposterIds.map(nameOf).map(escapeHtml).join(', ')}</b></div>
      </div>

      <div style="text-align:left; margin-bottom:10px; font-weight:600; font-size: 15px;">Voting Breakdown</div>
      <div class="player-list" style="text-align:left; margin-bottom:40px;">
        ${players.map((p) => {
          const votesReceived = voteCounts[p.id] || 0;
          const isEliminated = eliminatedIds.includes(p.id);
          return `
            <div class="player-row" style="background:${isEliminated ? 'rgba(255, 69, 58, 0.2)' : 'var(--bg-card)'}; border: 1px solid ${isEliminated ? 'var(--danger)' : 'rgba(255,255,255,0.05)'}; padding:12px; border-radius:8px; justify-content:space-between; backdrop-filter: blur(8px);">
              <div style="display:flex; align-items:center; gap:12px;">
                <div style="width:32px; height:32px; border-radius:50%; background:var(--accent-dark); display:flex; align-items:center; justify-content:center; font-size:12px; color:#FFF; font-weight:bold;">${escapeHtml(p.name[0] || '?')}</div>
                <div style="display:flex; flex-direction:column;">
                  <span style="font-weight:${isEliminated ? '700' : '400'}">${escapeHtml(p.name)}</span>
                  ${game.roles[p.id] === 'imposter' ? `<span style="font-size:11px; color:var(--danger); margin-top:2px;">(Imposter)</span>` : ''}
                </div>
              </div>
              <div style="font-size:13px; color:var(--text-muted);">${votesReceived} vote${votesReceived !== 1 ? 's' : ''}</div>
            </div>
          `;
        }).join('')}
      </div>

      ${mp.isHost ? `
        <button class="start-btn" style="margin-bottom:10px;" onclick="startOnlineGame()">Same Room, New Word</button>
        <button class="admin-btn-secondary" style="width:100%" onclick="db.ref('imposterRooms/'+mp.code+'/status').set('lobby')">Back to Lobby</button>
      ` : `
        <div class="card" style="text-align:center; color:var(--text-muted);">Waiting for host...</div>
      `}
      <button class="admin-btn-secondary" style="width:100%; margin-top:10px;" onclick="leaveRoom()">Leave Room</button>
    </div>
  `;

  startResultsBurst(imposterCaught && eliminatedIds.length === 1 && maxVotes > 0);
}

/* ---------------- Helpers ---------------- */
function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

let toastTimer = null;
function showToast(message, undoLabel, undoFn) {
  let el = document.getElementById('appToast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'appToast';
    el.className = 'toast';
    document.body.appendChild(el);
  }
  el.innerHTML = `<span>${escapeHtml(message)}</span>${undoFn ? `<button id="toastUndoBtn">${escapeHtml(undoLabel || 'Undo')}</button>` : ''}`;
  if (undoFn) {
    document.getElementById('toastUndoBtn').onclick = () => {
      undoFn();
      el.classList.remove('show');
      clearTimeout(toastTimer);
    };
  }
  requestAnimationFrame(() => el.classList.add('show'));
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 4000);
}

// Init
render();
</script>
</body>
</html>
