<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Imposter Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<!-- Add Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

<style>
  :root {
    --bg-main: #121216;
    --bg-card: #1C1C24;
    --bg-input: #252530;
    --text-main: #FFFFFF;
    --text-muted: #8E8E9E;
    --accent: #FF9F0A;
    --accent-dark: #CC7E00;
    --danger: #FF453A;
    --success: #32D74B;
    --radius: 16px;
    --radius-sm: 10px;
  }
  
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; font-family: 'Inter', sans-serif; background-color: var(--bg-main); color: var(--text-main); overflow-x: hidden; }
  
  /* Onam Flower Animation */
  .flower {
    position: fixed;
    top: -10vh;
    z-index: 9998;
    pointer-events: none;
    user-select: none;
    font-size: 14px;
    animation: fall linear infinite;
  }
  @keyframes fall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
  }

  /* Pop-up Animation */
  @keyframes popIn {
    0% { transform: scale(0.8); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  /* Among Us Run Animation */
  @keyframes runRight {
    0% { transform: translate(0, -50%); }
    15% { transform: translate(-20px, -50%); } /* Wind up backwards */
    100% { transform: translate(150vw, -50%); } /* Sprint off screen */
  }
  .run-away {
    animation: runRight 2s ease-in forwards !important;
    pointer-events: none; 
  }

  /* Watermark */
  .watermark {
    position: fixed;
    bottom: 8px;
    right: 12px;
    font-size: 10px;
    color: var(--text-muted);
    opacity: 0.5;
    z-index: 9999;
    pointer-events: none;
    letter-spacing: 0.5px;
  }

  .app-container {
    max-width: 500px;
    margin: 0 auto;
    min-height: 100vh;
    padding: 20px 16px 100px; 
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* Typography */
  h1 { font-size: 24px; font-weight: 700; text-align: center; margin: 10px 0 4px; }
  .subtitle { text-align: center; color: var(--text-muted); font-size: 14px; margin-bottom: 24px; }
  
  /* Cards */
  .card {
    background: var(--bg-card);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 16px;
  }
  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    font-weight: 600;
    font-size: 15px;
  }
  .card-header .count { color: var(--text-muted); font-size: 13px; font-weight: 400; }

  /* Player List */
  .player-list { display: flex; flex-direction: column; gap: 10px; }
  .player-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .player-idx {
    width: 38px; height: 38px;
    background: var(--accent-dark);
    color: #FFF;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 600;
    flex-shrink: 0;
    cursor: pointer;
    background-size: cover;
    background-position: center;
    position: relative;
    border: 2px solid transparent;
    transition: all 0.2s ease;
  }
  .player-idx:hover { border-color: var(--accent); transform: scale(1.05); }
  .player-idx .add-photo-icon {
    position: absolute; bottom: -2px; right: -2px; background: var(--bg-input);
    border-radius: 50%; padding: 2px; width: 14px; height: 14px;
    display: flex; align-items: center; justify-content: center; font-size: 10px;
    transition: all 0.2s ease;
  }
  .player-idx:hover .add-photo-icon { background: var(--accent); color: #000; }

  .player-input-wrap {
    flex: 1;
    background: var(--bg-input);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    display: flex; align-items: center;
    transition: all 0.2s ease;
  }
  .player-input-wrap:focus-within {
    box-shadow: 0 0 0 1px var(--accent);
  }
  .player-input-wrap input {
    background: transparent; border: none; color: var(--text-main); font-size: 15px; width: 100%; outline: none; font-family: 'Inter', sans-serif;
  }
  .del-btn {
    background: none; border: none; color: var(--text-muted); padding: 5px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all 0.2s ease;
  }
  .del-btn:hover { color: var(--danger); transform: scale(1.15); }
  
  .add-player-btn {
    width: 100%; background: transparent; border: 1px dashed var(--text-muted); color: var(--text-muted); padding: 12px; border-radius: var(--radius-sm); margin-top: 10px; cursor: pointer; font-size: 15px; font-weight: 500;
    transition: all 0.2s ease;
  }
  .add-player-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(255, 159, 10, 0.05);
  }

  /* Settings Toggles */
  .setting-row {
    display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #30303C; cursor: pointer;
    transition: background 0.2s ease;
    border-radius: 8px;
    margin: 0 -8px;
    padding: 12px 8px;
  }
  .setting-row:hover { background: rgba(255, 255, 255, 0.02); }
  .setting-row:last-child { border-bottom: none; }
  .setting-info { display: flex; gap: 12px; align-items: center; }
  .setting-icon { color: var(--accent); font-size: 18px; }
  .setting-text h3 { margin: 0; font-size: 15px; font-weight: 500; }
  .setting-text p { margin: 4px 0 0; font-size: 12px; color: var(--text-muted); }
  
  /* Toggle Switch */
  .switch {
    width: 44px; height: 24px; background: var(--bg-input); border-radius: 12px; position: relative; transition: 0.3s;
  }
  .switch::after {
    content: ''; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; background: #FFF; border-radius: 50%; transition: 0.3s;
  }
  .switch.active { background: var(--accent); }
  .switch.active::after { transform: translateX(20px); }

  /* Bottom Bar */
  .bottom-bar {
    position: fixed; bottom: 0; left: 0; right: 0; padding: 16px; background: var(--bg-main); border-top: 1px solid #202028; display: flex; justify-content: center; z-index: 10;
  }
  .bottom-bar .inner { width: 100%; max-width: 500px; }
  .start-btn {
    width: 100%; background: var(--accent); color: #000; font-weight: 600; font-size: 16px; padding: 16px; border: none; border-radius: var(--radius-sm); cursor: pointer; font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: all 0.2s ease;
  }
  .start-btn:hover:not(:disabled) {
    filter: brightness(1.1);
    transform: translateY(-2px);
    box-shadow: 0 4px 15px rgba(255, 159, 10, 0.3);
  }
  .start-btn:active { opacity: 0.8; transform: scale(0.98); box-shadow: none; }
  .start-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; filter: none; }

  /* Chips */
  .chip-container { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .chip { background: var(--bg-input); color: var(--text-muted); padding: 8px 14px; border-radius: 20px; font-size: 13px; cursor: pointer; transition: all 0.2s ease; }
  .chip:hover:not(.active) { background: #353545; color: #FFF; }
  .chip.active { background: var(--accent-dark); color: #FFF; border: 1px solid var(--accent); }

  /* Admin Panel specific */
  .admin-box { background: var(--bg-card); padding: 20px; border-radius: var(--radius); margin-bottom: 20px;}
  .admin-input { width: 100%; padding: 12px; background: var(--bg-input); border: 1px solid #30303C; color: #FFF; border-radius: 8px; margin-bottom: 10px; font-size: 16px; transition: border-color 0.2s;}
  .admin-input:focus { outline: none; border-color: var(--accent); }
  .admin-btn { background: var(--accent); color: #000; padding: 10px 16px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; transition: all 0.2s ease; }
  .admin-btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
  .admin-btn:active { transform: scale(0.96); }
  .admin-btn-secondary { background: var(--bg-input); color: #FFF; border: 1px solid #30303C; padding: 10px 16px; border-radius: 8px; cursor: pointer; width: 100%; font-size: 15px; font-weight: 500; transition: all 0.2s ease; }
  .admin-btn-secondary:hover { background: #2a2a36; border-color: var(--text-muted); }
  .admin-btn-secondary:active { transform: scale(0.98); }
  .word-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .word-chip { background: var(--bg-input); padding: 5px 10px; border-radius: 4px; font-size: 12px; display: flex; align-items: center; gap: 5px; transition: background 0.2s; }
  .word-chip:hover { background: #2a2a36; }
  .word-chip span { transition: transform 0.2s; display: inline-block; }
  .word-chip span:hover { transform: scale(1.2); }
  
  /* In-game screens */
  .game-screen { text-align: center; padding-top: 40px; }
  .card-3d-wrap { perspective: 1000px; width: 100%; height: 300px; margin: 30px 0; position: relative; }
  .card-3d { width: 100%; height: 100%; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), top 0.5s ease, opacity 0.5s ease; transform-style: preserve-3d; cursor: pointer; position: absolute; top:0; }
  .card-3d:hover:not(.flipped):not(.discarded) { transform: scale(1.02); }
  .card-3d.flipped { transform: rotateY(180deg); }
  .card-3d.discarded { top: 100%; opacity: 0; pointer-events: none; transform: rotateY(180deg) scale(0.8); }
  .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: var(--radius); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; border: 1px solid #30303C; transition: box-shadow 0.3s ease; }
  .card-3d:hover .card-face { box-shadow: 0 8px 25px rgba(0,0,0,0.4); }
  .card-front { background: var(--bg-card); }
  .card-back { background: var(--bg-input); transform: rotateY(180deg); }
  .tap-hint { border: 1px dashed var(--text-muted); color: var(--text-muted); padding: 8px 12px; border-radius: 6px; font-size: 12px; margin-top: 20px; transition: 0.3s; }

  /* Voting UI */
  .vote-option { background: var(--bg-input); border: 2px solid transparent; padding: 16px; border-radius: var(--radius-sm); margin-bottom: 10px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; font-size: 16px; transition: all 0.2s ease; }
  .vote-option:hover:not(.selected) { background: #2a2a36; transform: translateX(4px); }
  .vote-option.selected { border-color: var(--accent); background: #3c2a12; }
  .vote-radio { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--text-muted); transition: all 0.2s ease; }
  .vote-option.selected .vote-radio { border-color: var(--accent); background: var(--accent); box-shadow: inset 0 0 0 4px #3c2a12; }
  
  /* Welcome Screen Image Style - Flat Square */
  .hero-image {
    width: 220px;
    height: 220px;
    margin: 0 auto 40px;
    background: url('https://res.cloudinary.com/uzfgyrxf/image/upload/v1787771294/FyvT48GaIAAx4l4.jpg') center/cover no-repeat;
    border-radius: 20px;
    border: 3px solid var(--danger);
    box-shadow: 0 10px 40px rgba(255, 69, 58, 0.4); 
    position: relative;
    z-index: 2;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }
  .hero-image:hover {
    transform: scale(1.05);
    box-shadow: 0 15px 50px rgba(255, 69, 58, 0.6); 
  }

  /* Overlay Modal */
  .overlay {
    display: none;
    position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); z-index: 10000;
    justify-content: center; align-items: center; padding: 20px;
  }
  .popup-box {
    background: var(--bg-card); border: 2px solid var(--accent); padding: 40px 20px;
    border-radius: 20px; text-align: center; width: 100%; max-width: 350px;
    animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    box-shadow: 0 10px 40px rgba(255, 159, 10, 0.2);
  }
</style>
</head>
<body>

<div class="watermark">powered by adruzz</div>
<div class="app-container" id="app"></div>

<!-- Happy Onam Modal -->
<div class="overlay" id="onamModal">
  <div class="popup-box">
    <div style="font-size: 50px; margin-bottom: 10px;">🌸</div>
    <h1 style="color: var(--accent); font-size: 32px; margin-top: 0;">Happy Onam!</h1>
    <p style="color: var(--text-muted); margin-bottom: 30px;">May this beautiful festival bring you joy, peace, and prosperity.</p>
    <button class="start-btn" onclick="closePopupAndStart()">Let's Play</button>
  </div>
</div>

<script>
/* ---------------- Initial Data & Firebase Setup ---------------- */

// Define Categories explicitly so they never disappear even if Firebase strips empty lists
const DEFAULT_CATEGORIES = [
  "Funny", "Movies", "Characters", "Festivals", "Places", "Food", 
  "Bakery", "Household Items", "People", "Kerala Life", "Vehicles", 
  "College / School", "Gulf / NRI", "FIFA", "Bigg Boss", "Onam"
];

let PACKS = {};
DEFAULT_CATEGORIES.forEach(cat => PACKS[cat] = []);

// Initialize Firebase
const firebaseConfig = {
  apiKey: "AIzaSyAtvDrGOe_qR-5_tBPwIn0NYX7E_Z5s_v8",
  authDomain: "imposter-game-f8b23.firebaseapp.com",
  databaseURL: "https://imposter-game-f8b23-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "imposter-game-f8b23",
  storageBucket: "imposter-game-f8b23.firebasestorage.app",
  messagingSenderId: "1030539812185",
  appId: "1:1030539812185:web:fe4f8c322d222f70ac0048"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// Listen for live updates from Firebase Database
db.ref('packs').on('value', (snapshot) => {
  const data = snapshot.val() || {};
  
  // Safely map Firebase data back into our local PACKS object
  DEFAULT_CATEGORIES.forEach(cat => {
    if (data[cat]) {
      // Firebase occasionally turns arrays into objects if items are deleted. This safeguards against that.
      PACKS[cat] = Array.isArray(data[cat]) ? data[cat] : Object.values(data[cat]);
    } else {
      PACKS[cat] = []; // If Firebase deleted it for being empty, put it back
    }
  });

  // Ensure active categories don't contain deleted ones
  state.activeCategories = state.activeCategories.filter(c => DEFAULT_CATEGORIES.includes(c));
  
  // Re-render UI to show synced words (only if not actively playing a round)
  if (state.screen === 'setup' || state.screen === 'admin' || state.screen === 'welcome' || !window.location.hash) {
    render();
  }
});

function savePacks() {
  // Save directly to live Firebase database. 
  // Note: Firebase will silently strip empty arrays during transit, but our on('value') listener will rebuild them.
  db.ref('packs').set(PACKS);
}

/* ---------------- Onam Flowers Animation ---------------- */
function startOnamFlowers() {
  const emojis = ['🌸', '🌼', '🌺', '🍃'];
  for (let i = 0; i < 25; i++) {
    let flower = document.createElement('div');
    flower.className = 'flower';
    flower.innerText = emojis[Math.floor(Math.random() * emojis.length)];
    flower.style.left = Math.random() * 100 + 'vw';
    flower.style.animationDuration = (Math.random() * 3 + 4) + 's'; 
    flower.style.animationDelay = Math.random() * 5 + 's';
    flower.style.fontSize = (Math.random() * 10 + 10) + 'px';
    document.body.appendChild(flower);
  }
}
startOnamFlowers(); 

/* ---------------- State ---------------- */
let state = {
  screen: 'setup',
  names: ["Player 1", "Player 2", "Player 3"],
  photos: [null, null, null], 
  activeCategories: [...DEFAULT_CATEGORIES], // Select all by default
  imposterCount: 1,
  imposterSeesCategory: true,
  showImposterHint: false, 
  
  players: [],      
  secretWord: "",
  secretCategory: "",
  imposterHintWord: "", 
  currentIndex: 0,
  
  votes: {},
  selectedVoteIndex: null, 
  
  adminAuthenticated: false,
  adminSelectedCategory: null
};

const app = document.getElementById('app');

/* ---------------- Router ---------------- */
function render() {
  const hash = window.location.hash;
  if (hash === '' || hash === '#welcome') {
    state.screen = 'welcome';
    renderWelcome();
  } else if (hash === '#setup') {
    state.screen = 'setup';
    renderSetup(); 
  } else if (hash === '#admin') {
    state.screen = 'admin';
    if (!state.adminAuthenticated) renderAdminLogin();
    else renderAdminPanel();
  } else if (hash === '#play') {
    state.screen = 'play';
    renderPass();
  } else if (hash === '#interrogate') {
    state.screen = 'interrogate';
    renderInterrogate();
  } else if (hash === '#vote-pass') {
    state.screen = 'vote-pass';
    renderVotePass();
  } else if (hash === '#vote-cast') {
    state.screen = 'vote-cast';
    renderVoteCast();
  } else if (hash === '#results') {
    state.screen = 'results';
    renderResults();
  }
}
window.addEventListener('hashchange', render);

/* ---------------- SVG Icons ---------------- */
const icons = {
  trash: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>`,
  tag: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path><line x1="7" y1="7" x2="7.01" y2="7"></line></svg>`,
  bulb: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"></path><path d="M10 22h4"></path><path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5A4.61 4.61 0 0 1 8.91 14"></path></svg>`,
  play: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>`,
  admin: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>`
};

/* ---------------- 0. Welcome Screen ---------------- */
function renderWelcome() {
  app.innerHTML = `
    <div class="game-screen" style="height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding-top: 0; margin-top: -20px; position: relative;">
      
      <!-- Background Glow Effect just for Welcome Screen -->
      <div style="position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); width: 250px; height: 250px; background: var(--danger); filter: blur(120px); opacity: 0.35; pointer-events: none; z-index: 0;"></div>
      
      <!-- Main Title with Among Us SVG - Nudged slightly to the right -->
      <div style="text-align: center; margin-bottom: 30px; position: relative; z-index: 2; padding-left: 20px;">
        <h1 style="font-family: 'Inter', sans-serif; font-size: clamp(34px, 8vw, 44px); font-weight: 900; letter-spacing: 4px; text-transform: uppercase; color: #FFFFFF; text-shadow: 0 4px 20px rgba(255,69,58,0.6); display: inline-block; position: relative; margin: 0;">
          IMPOSTER
          <svg onclick="this.classList.add('run-away')" width="40" height="40" viewBox="0 0 512 512" style="position: absolute; top: 50%; right: -50px; transform: translate(0, -50%); cursor: pointer; filter: drop-shadow(0 2px 5px rgba(255,69,58,0.8));">
             <path fill="#FF453A" d="M379.7,85.2c-29.4-36.2-74-56.1-120.4-56.1c-84.3,0-152.7,68.4-152.7,152.7v174c0,35.3,28.6,64,63.9,64c35.3,0,63.9-28.7,63.9-64v-38.3h43v38.3c0,35.3,28.6,64,63.9,64c35.3,0,63.9-28.7,63.9-64V188.7C405.2,148.9,396.6,112.5,379.7,85.2z"/>
             <path fill="#71C7D5" d="M366.5,124.9H228.3c-29.6,0-53.5,24-53.5,53.5v15c0,29.6,24,53.5,53.5,53.5h138.2c29.6,0,53.5-24,53.5-53.5v-15C420,148.9,396.1,124.9,366.5,124.9z"/>
             <path fill="#FF453A" d="M106.6,193.3H78.9c-21.7,0-39.3,17.6-39.3,39.3v85.2c0,21.7,17.6,39.3,39.3,39.3h27.7V193.3z"/>
          </svg>
        </h1>
      </div>
      
      <!-- Hero Image -->
      <div class="hero-image"></div>
      
      <!-- Subtitle -->
      <h2 style="font-size: 28px; color: var(--accent); font-weight: 600; margin: 0 0 20px 0; letter-spacing: 1.5px; text-shadow: 0 2px 10px rgba(255,159,10,0.3); position: relative; z-index: 2;">സ്വാഗതം</h2>
      
      <!-- Action Button -->
      <button class="start-btn" style="width: 80%; max-width: 300px; background: linear-gradient(135deg, #FF453A 0%, #FF9F0A 100%); color: #FFF; box-shadow: 0 4px 15px rgba(255,69,58,0.4); border: none; position: relative; z-index: 2;" onclick="showOnamPopup()">Enter Game</button>
    </div>
  `;
}

window.showOnamPopup = () => {
  document.getElementById('onamModal').style.display = 'flex';
};

window.closePopupAndStart = () => {
  document.getElementById('onamModal').style.display = 'none';
  window.location.hash = '#setup';
};

/* ---------------- 1. Setup Screen ---------------- */
function renderSetup() {
  let categoriesHTML = DEFAULT_CATEGORIES.map(cat => {
    const isActive = state.activeCategories.includes(cat);
    const count = PACKS[cat] ? PACKS[cat].length : 0;
    return `<div class="chip ${isActive ? 'active' : ''}" onclick="toggleCategory('${cat}')">${cat} (${count})</div>`;
  }).join('');

  app.innerHTML = `
    <h1>Set up game</h1>
    <div class="subtitle">Configure before starting</div>

    <div class="card">
      <div class="card-header">
        <span>👥 Players</span>
        <span class="count">${state.names.length} / 15</span>
      </div>
      <p style="font-size:12px; color:var(--text-muted); margin-top:-10px; margin-bottom:15px;">Tap the circle to add a player photo</p>
      
      <div class="player-list" id="playerList"></div>
      ${state.names.length < 15 ? `<button class="add-player-btn" onclick="addPlayer()">+ Add Player</button>` : ''}
    </div>

    <div class="card">
      <div class="setting-row" style="border-bottom:none;">
        <div class="setting-info">
          <div class="setting-icon">${icons.tag}</div>
          <div class="setting-text">
            <h3>Categories</h3>
            <p>${state.activeCategories.length} of ${DEFAULT_CATEGORIES.length} selected</p>
          </div>
        </div>
      </div>
      <div class="chip-container">${categoriesHTML}</div>
    </div>

    <div class="card">
      <div class="setting-row" onclick="toggleSetting('imposterSeesCategory')">
        <div class="setting-info">
          <div class="setting-icon">${icons.tag}</div>
          <div class="setting-text">
            <h3>Imposter sees category</h3>
            <p>Imposter can see the category name</p>
          </div>
        </div>
        <div class="switch ${state.imposterSeesCategory ? 'active' : ''}"></div>
      </div>
      
      <div class="setting-row" onclick="toggleSetting('showImposterHint')">
        <div class="setting-info">
          <div class="setting-icon">${icons.bulb}</div>
          <div class="setting-text">
            <h3>Show imposter a hint</h3>
            <p>Imposter sees a related but different word</p>
          </div>
        </div>
        <div class="switch ${state.showImposterHint ? 'active' : ''}"></div>
      </div>
    </div>

    <div class="bottom-bar">
      <div class="inner">
        <button class="start-btn" onclick="startGame()">
          ${icons.play} Start Game
        </button>
      </div>
    </div>
  `;

  // Render Player Inputs
  const list = document.getElementById('playerList');
  state.names.forEach((name, i) => {
    const hasPhoto = state.photos[i] ? true : false;
    const bgStyle = hasPhoto ? `background-image: url('${state.photos[i]}'); color: transparent;` : '';
    
    list.innerHTML += `
      <div class="player-row">
        <input type="file" id="photo-upload-${i}" style="display:none" accept="image/*" onchange="handlePhotoUpload(event, ${i})">
        <div class="player-idx" style="${bgStyle}" onclick="document.getElementById('photo-upload-${i}').click()">
          ${hasPhoto ? '' : i + 1}
          <div class="add-photo-icon">📷</div>
        </div>
        <div class="player-input-wrap">
          <input type="text" value="${escapeHtml(name)}" onchange="updatePlayerName(${i}, this.value)" placeholder="Player Name">
          <button class="del-btn" onclick="removePlayer(${i})">${icons.trash}</button>
        </div>
      </div>
    `;
  });
}

window.handlePhotoUpload = (e, idx) => {
  const file = e.target.files[0];
  if (!file) return;
  
  const reader = new FileReader();
  reader.onload = (event) => {
    const img = new Image();
    img.onload = () => {
      // Compress and crop image to save memory (150x150)
      const canvas = document.createElement('canvas');
      const size = 150; 
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      
      const minDim = Math.min(img.width, img.height);
      const startX = (img.width - minDim) / 2;
      const startY = (img.height - minDim) / 2;
      
      ctx.drawImage(img, startX, startY, minDim, minDim, 0, 0, size, size);
      
      // Save compressed base64 to state
      state.photos[idx] = canvas.toDataURL('image/jpeg', 0.8);
      renderSetup();
    };
    img.src = event.target.result;
  };
  reader.readAsDataURL(file);
};

window.updatePlayerName = (idx, val) => { state.names[idx] = val; };
window.addPlayer = () => { 
  if (state.names.length < 15) { 
    state.names.push(`Player ${state.names.length + 1}`); 
    state.photos.push(null);
    renderSetup(); 
  } 
};
window.removePlayer = (idx) => { 
  if (state.names.length > 3) { 
    state.names.splice(idx, 1); 
    state.photos.splice(idx, 1);
    renderSetup(); 
  } else { 
    alert("Minimum 3 players required."); 
  } 
};
window.toggleCategory = (cat) => {
  if (state.activeCategories.includes(cat)) {
    if (state.activeCategories.length > 1) state.activeCategories = state.activeCategories.filter(c => c !== cat);
  } else {
    state.activeCategories.push(cat);
  }
  renderSetup();
};
window.toggleSetting = (key) => { state[key] = !state[key]; renderSetup(); };

function startGame() {
  if (state.activeCategories.length === 0) return alert("Select at least one category.");
  
  // Only allow categories that actually have words
  const categoriesWithWords = state.activeCategories.filter(cat => PACKS[cat] && PACKS[cat].length > 0);
  
  if (categoriesWithWords.length === 0) {
    return alert("All selected categories are empty! Add some words in the Admin panel (/#admin) first.");
  }
  
  const finalNames = state.names.map((n, i) => n.trim() || `Player ${i + 1}`);
  const category = categoriesWithWords[Math.floor(Math.random() * categoriesWithWords.length)];
  const wordList = PACKS[category];
  
  const wordIdx = Math.floor(Math.random() * wordList.length);
  const word = wordList[wordIdx];
  
  let hintWord = "";
  if (state.showImposterHint && wordList.length > 1) {
    let hintIdx = wordIdx;
    while(hintIdx === wordIdx) { hintIdx = Math.floor(Math.random() * wordList.length); }
    hintWord = wordList[hintIdx];
  }

  const indices = [...Array(finalNames.length).keys()];
  for (let i = indices.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [indices[i], indices[j]] = [indices[j], indices[i]];
  }
  
  const imposterSet = new Set(indices.slice(0, state.imposterCount));

  state.players = finalNames.map((name, i) => ({
    name,
    photo: state.photos[i], // Store photo with the player
    role: imposterSet.has(i) ? 'imposter' : 'crew'
  }));
  
  state.secretWord = word;
  state.secretCategory = category;
  state.imposterHintWord = hintWord;
  
  state.currentIndex = 0;
  state.votes = {};
  
  window.location.hash = '#play';
}

/* ---------------- 2. Admin Panel ---------------- */
function renderAdminLogin() {
  app.innerHTML = `
    <div class="game-screen">
      <h1>Admin Access</h1>
      <p class="subtitle">Enter password to manage words</p>
      <div class="admin-box">
        <input type="password" id="adminPwd" class="admin-input" placeholder="Password">
        <button class="admin-btn" style="width:100%" onclick="checkAdmin()">Login</button>
      </div>
      <button class="admin-btn-secondary" onclick="window.location.hash='#setup'">Back to Setup</button>
    </div>
  `;
}

window.checkAdmin = () => {
  if (document.getElementById('adminPwd').value === 'adarsh@12345') {
    state.adminAuthenticated = true;
    renderAdminPanel();
  } else {
    alert("Incorrect password");
  }
};

function renderAdminPanel() {
  if (state.adminSelectedCategory) {
    const cat = state.adminSelectedCategory;
    const words = PACKS[cat] || [];
    app.innerHTML = `
      <h1>Manage Words</h1>
      <p class="subtitle">Category: ${cat}</p>
      <div class="admin-box">
        <div style="display:flex; gap:10px; margin-bottom:15px;">
          <input type="text" id="newWord" class="admin-input" style="margin:0;" placeholder="New word...">
          <button class="admin-btn" onclick="addWord('${cat}')">Add</button>
        </div>
        <div class="word-list">
          ${words.map((w, i) => `
            <div class="word-chip">
              ${escapeHtml(w)}
              <span style="color:var(--danger); cursor:pointer; margin-left:5px;" onclick="deleteWord('${cat}', ${i})">✖</span>
            </div>
          `).join('')}
        </div>
      </div>
      <button class="admin-btn-secondary" onclick="state.adminSelectedCategory=null; renderAdminPanel();">Back to Categories</button>
    `;
  } else {
    app.innerHTML = `
      <h1>Admin Panel</h1>
      <p class="subtitle">Manage Categories & Words (Live Sync)</p>
      <div class="admin-box">
        <div class="player-list">
          ${DEFAULT_CATEGORIES.map(cat => `
            <div class="player-row" style="background:var(--bg-input); padding:10px; border-radius:8px;">
              <div style="flex:1; cursor:pointer;" onclick="state.adminSelectedCategory='${cat}'; renderAdminPanel();">
                ${cat} (${PACKS[cat] ? PACKS[cat].length : 0} words)
              </div>
            </div>
          `).join('')}
        </div>
      </div>
      <button class="admin-btn-secondary" style="width:100%;" onclick="window.location.hash='#setup'">Save & Back to Game</button>
    `;
  }
}

window.addWord = (cat) => {
  const val = document.getElementById('newWord').value.trim();
  if (val) { 
    if(!PACKS[cat]) PACKS[cat] = [];
    PACKS[cat].push(val); 
    savePacks(); 
    renderAdminPanel(); 
    document.getElementById('newWord').value = '';
  }
};
window.deleteWord = (cat, idx) => {
  PACKS[cat].splice(idx, 1); 
  savePacks(); 
  renderAdminPanel();
};

/* ---------------- 3. Play / Reveal Phase ---------------- */
function renderPass() {
  const p = state.players[state.currentIndex];
  const total = state.players.length;
  
  app.innerHTML = `
    <div class="game-screen">
      <div class="subtitle">Agent ${state.currentIndex + 1} of ${total}</div>
      <p style="color:var(--text-muted); font-size:14px;">Pass device to <b style="color:var(--text-main)">${escapeHtml(p.name)}</b></p>
      
      <div class="card-3d-wrap">
        <div class="card-3d" id="activeCard">
          <div class="card-face card-front">
            ${p.photo ? `<img src="${p.photo}" style="width:80px; height:80px; border-radius:50%; object-fit:cover; margin-bottom:15px; border:2px solid var(--accent);">` : ''}
            <div style="color:var(--accent); font-weight:600; font-size:12px; letter-spacing:2px;">CLASSIFIED</div>
            <h2 style="font-size:32px; margin:10px 0;">${escapeHtml(p.name)}</h2>
            <div class="tap-hint" id="frontHint">TAP TO REVEAL (2 VIEWS LEFT)</div>
          </div>
          
          <div class="card-face card-back">
            ${p.role === 'imposter' ? `
              <div style="color:var(--danger); font-size:12px; font-weight:700; letter-spacing:2px; margin-bottom:10px;">STATUS</div>
              <h2 style="color:var(--danger); font-size:32px; margin:0; line-height:1.2;">You Are<br>The Imposter</h2>
              ${state.imposterSeesCategory ? `<div style="margin-top:10px; font-size:14px; color:var(--text-muted);">Category:<br><b style="color:var(--text-main)">${escapeHtml(state.secretCategory)}</b></div>` : ''}
              ${state.showImposterHint ? `<div style="margin-top:5px; font-size:14px; color:var(--text-muted);">Fake Hint Word:<br><b style="color:var(--accent)">${escapeHtml(state.imposterHintWord)}</b></div>` : ''}
            ` : `
              <div style="color:var(--text-muted); font-size:12px; font-weight:700; letter-spacing:2px; margin-bottom:10px;">THE SECRET WORD</div>
              <h2 style="font-size:32px; margin:0; color:var(--accent);">${escapeHtml(state.secretWord)}</h2>
              <div style="margin-top:20px; font-size:14px; color:var(--text-muted);">Category: <b style="color:var(--text-main)">${escapeHtml(state.secretCategory)}</b></div>
            `}
            <div class="tap-hint" id="backHint" style="margin-top:15px; border-color:var(--text-muted); color:var(--text-muted);">TAP TO HIDE</div>
          </div>
        </div>
      </div>
      
      <div style="min-height: 60px; margin-top: 20px;">
        <button class="start-btn" id="nextPlayerBtn" style="display:none; width: 100%;">I'm Done - Pass Device</button>
      </div>
      <button class="admin-btn-secondary" id="cancelBtn" style="margin-top:10px;">Cancel Round</button>
    </div>
  `;

  const card = document.getElementById('activeCard');
  const frontHint = document.getElementById('frontHint');
  const backHint = document.getElementById('backHint');
  const nextBtn = document.getElementById('nextPlayerBtn');
  const cancelBtn = document.getElementById('cancelBtn');

  let viewsLeft = 2;
  let isRevealed = false;
  let hasDiscarded = false;

  card.addEventListener('click', () => {
    if (hasDiscarded) return;

    if (!isRevealed) {
      if (viewsLeft <= 0) return; // No views left
      isRevealed = true;
      viewsLeft--;
      card.classList.add('flipped');
      nextBtn.style.display = 'none'; 
    } else {
      isRevealed = false;
      card.classList.remove('flipped');
      
      if (viewsLeft > 0) {
        frontHint.innerText = `TAP TO REVEAL (${viewsLeft} VIEW LEFT)`;
      } else {
        frontHint.innerText = `FILE LOCKED (0 VIEWS LEFT)`;
        frontHint.style.borderColor = 'var(--danger)';
        frontHint.style.color = 'var(--danger)';
      }
      
      nextBtn.style.display = 'flex'; // Show pass button
    }
  });

  nextBtn.addEventListener('click', () => {
    if (hasDiscarded) return;
    hasDiscarded = true;
    
    card.classList.add('discarded');

    setTimeout(() => {
      if (state.currentIndex < total - 1) {
        state.currentIndex++;
        renderPass();
      } else {
        window.location.hash = '#interrogate';
      }
    }, 500); 
  });

  cancelBtn.addEventListener('click', () => {
    if (confirm('Cancel round?')) {
      window.location.hash = '#setup';
    }
  });
}

/* ---------------- 4. Interrogation ---------------- */
function renderInterrogate() {
  app.innerHTML = `
    <div class="game-screen" style="padding-top:20px;">
      <div style="font-size:50px; margin-bottom:10px;">💬</div>
      <h1>Interrogation Phase</h1>
      <p class="subtitle" style="margin-bottom:40px;">Discuss and figure out who is lying.</p>
      
      <div style="padding: 20px; background: var(--bg-card); border-radius: var(--radius); margin-bottom: 20px; text-align: left;">
        <h3 style="margin-top:0; font-size: 16px;">Next Step: Secret Voting</h3>
        <p style="color: var(--text-muted); font-size: 14px; line-height: 1.5; margin-bottom: 0;">Once the discussion is over, pass the device around again so everyone can secretly cast their vote for the suspected Imposter.</p>
      </div>

      <button class="start-btn" onclick="startVotingPhase()">
        Start Voting Phase
      </button>
    </div>
  `;
}

function startVotingPhase() {
  state.currentIndex = 0;
  state.votes = {};
  window.location.hash = '#vote-pass';
}

/* ---------------- 5. Voting Phase ---------------- */
function renderVotePass() {
  const p = state.players[state.currentIndex];
  app.innerHTML = `
    <div class="game-screen" style="padding-top:60px;">
      <div class="subtitle">Voting phase: ${state.currentIndex + 1} / ${state.players.length}</div>
      ${p.photo ? `<img src="${p.photo}" style="width:100px; height:100px; border-radius:50%; object-fit:cover; margin: 20px auto 10px; border:3px solid var(--accent); display:block;">` : ''}
      <h1 style="font-size:30px; margin-bottom: 30px;">Pass to <span style="color:var(--accent)">${escapeHtml(p.name)}</span></h1>
      <p style="color:var(--text-muted); font-size:14px; margin-bottom:40px;">Make sure no one else is looking before you continue.</p>
      
      <button class="start-btn" onclick="window.location.hash='#vote-cast'">
        I am ${escapeHtml(p.name)}
      </button>
    </div>
  `;
}

function renderVoteCast() {
  state.selectedVoteIndex = null;
  
  let optionsHTML = state.players.map((p, i) => {
    if (i === state.currentIndex) return ''; 
    const avatar = p.photo 
      ? `<img src="${p.photo}" style="width:32px; height:32px; border-radius:50%; object-fit:cover;">` 
      : `<div style="width:32px; height:32px; border-radius:50%; background:var(--accent-dark); display:flex; align-items:center; justify-content:center; font-size:12px; color:#FFF; font-weight:bold;">${i+1}</div>`;
      
    return `
      <div class="vote-option" id="vote-opt-${i}" onclick="selectVote(${i})">
        <div style="display:flex; align-items:center; gap:12px;">
          ${avatar}
          <span>${escapeHtml(p.name)}</span>
        </div>
        <div class="vote-radio"></div>
      </div>
    `;
  }).join('');

  app.innerHTML = `
    <div style="padding-top:20px;">
      <h2 style="margin-bottom:5px;">Who is the Imposter?</h2>
      <p class="subtitle" style="text-align:left; margin-bottom:20px;">Secretly select a player to eliminate.</p>
      
      <div style="margin-bottom: 80px;">
        ${optionsHTML}
      </div>

      <div class="bottom-bar">
        <div class="inner">
          <button class="start-btn" id="confirmVoteBtn" disabled onclick="submitVote()">
            Confirm Vote
          </button>
        </div>
      </div>
    </div>
  `;
}

window.selectVote = (idx) => {
  state.selectedVoteIndex = idx;
  document.querySelectorAll('.vote-option').forEach(el => el.classList.remove('selected'));
  document.getElementById(`vote-opt-${idx}`).classList.add('selected');
  document.getElementById('confirmVoteBtn').disabled = false;
};

window.submitVote = () => {
  if (state.selectedVoteIndex === null) return;
  state.votes[state.currentIndex] = state.selectedVoteIndex;
  
  if (state.currentIndex < state.players.length - 1) {
    state.currentIndex++;
    window.location.hash = '#vote-pass';
  } else {
    window.location.hash = '#results';
  }
};

/* ---------------- 6. Results ---------------- */
function renderResults() {
  const voteCounts = {};
  Object.values(state.votes).forEach(votedIdx => {
    voteCounts[votedIdx] = (voteCounts[votedIdx] || 0) + 1;
  });

  let maxVotes = 0;
  for (let idx in voteCounts) {
    if (voteCounts[idx] > maxVotes) maxVotes = voteCounts[idx];
  }

  const eliminatedIndices = Object.keys(voteCounts)
    .map(Number)
    .filter(idx => voteCounts[idx] === maxVotes);
    
  const imposters = state.players.filter(p => p.role === 'imposter');
  const imposterIndices = state.players.map((p, i) => p.role === 'imposter' ? i : -1).filter(i => i !== -1);
  
  const imposterCaught = eliminatedIndices.some(idx => imposterIndices.includes(idx));
  
  let outcomeHTML = "";
  if (eliminatedIndices.length > 1) {
    outcomeHTML = `<h1 style="color:var(--accent)">Voting Tied!</h1>
                   <p style="color:var(--text-muted); margin-top:5px;">${eliminatedIndices.map(i => escapeHtml(state.players[i].name)).join(' and ')} tied with ${maxVotes} votes. The imposter survived!</p>`;
  } else if (imposterCaught) {
    outcomeHTML = `<h1 style="color:var(--success)">Imposter Caught!</h1>
                   <p style="color:var(--text-muted); margin-top:5px;">Crew wins! ${escapeHtml(state.players[eliminatedIndices[0]].name)} was voted out.</p>`;
  } else {
    outcomeHTML = `<h1 style="color:var(--danger)">Crew Failed!</h1>
                   <p style="color:var(--text-muted); margin-top:5px;">${escapeHtml(state.players[eliminatedIndices[0]].name)} was innocent! The imposter survives.</p>`;
  }

  app.innerHTML = `
    <div class="game-screen" style="padding-top:20px; padding-bottom:40px;">
      <div style="color:var(--text-muted); font-size:12px; font-weight:700; letter-spacing:2px; margin-bottom:10px;">CASE CLOSED</div>
      
      ${outcomeHTML}
      
      <div style="border: 1px dashed #30303C; padding: 20px; border-radius: var(--radius); margin: 30px 0;">
        <div style="font-size:12px; color:var(--text-muted); margin-bottom:5px;">THE WORD WAS</div>
        <div style="font-size:24px; color:var(--accent); font-weight:700; text-transform:uppercase;">${escapeHtml(state.secretWord)}</div>
        <div style="font-size:12px; color:var(--text-muted); margin-top:10px;">ACTUAL IMPOSTER: <b style="color:var(--danger)">${imposters.map(i => escapeHtml(i.name)).join(', ')}</b></div>
      </div>
      
      <div style="text-align:left; margin-bottom:10px; font-weight:600; font-size: 15px;">Voting Breakdown</div>
      <div class="player-list" style="text-align:left; margin-bottom:40px;">
        ${state.players.map((p, i) => {
          const votesReceived = voteCounts[i] || 0;
          const isEliminated = eliminatedIndices.includes(i);
          const avatar = p.photo 
            ? `<img src="${p.photo}" style="width:32px; height:32px; border-radius:50%; object-fit:cover;">` 
            : `<div style="width:32px; height:32px; border-radius:50%; background:var(--accent-dark); display:flex; align-items:center; justify-content:center; font-size:12px; color:#FFF; font-weight:bold;">${i+1}</div>`;
            
          return `
            <div class="player-row" style="background:${isEliminated ? '#FF453A11' : 'var(--bg-card)'}; border: 1px solid ${isEliminated ? 'var(--danger)' : 'transparent'}; padding:12px; border-radius:8px; justify-content:space-between;">
              <div style="display:flex; align-items:center; gap:12px;">
                ${avatar}
                <div style="display:flex; flex-direction:column;">
                  <span style="font-weight:${isEliminated ? '700' : '400'}">${escapeHtml(p.name)}</span>
                  ${p.role === 'imposter' ? `<span style="font-size:11px; color:var(--danger); margin-top:2px;">(Imposter)</span>` : ''}
                </div>
              </div>
              <div style="font-size:13px; color:var(--text-muted);">
                ${votesReceived} vote${votesReceived !== 1 ? 's' : ''}
              </div>
            </div>
          `;
        }).join('')}
      </div>

      <button class="start-btn" style="margin-bottom:10px;" onclick="startGame()">Same Roster, New Word</button>
      <button class="admin-btn-secondary" style="width:100%" onclick="window.location.hash='#setup'">New Setup</button>
    </div>
  `;
}

/* ---------------- Helpers ---------------- */
function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

// Init
render();
</script>

</html>
