<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Imposter Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#121216">

<!-- Add Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

<style>
  :root {
    --bg-main: #121216;
    --bg-card: rgba(28, 28, 36, 0.75);
    --bg-input: rgba(37, 37, 48, 0.9);
    --text-main: #FFFFFF;
    --text-muted: #A0A0B0;
    --accent: #FF9F0A;
    --accent-dark: #CC7E00;
    --danger: #FF453A;
    --success: #32D74B;
    --radius: 16px;
    --radius-sm: 10px;
    --max-w: 540px;
  }
  
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
    font-family: 'Inter', sans-serif;
    background: linear-gradient(rgba(18, 18, 22, 0.65), rgba(18, 18, 22, 0.85)), url('https://res.cloudinary.com/uzfgyrxf/image/upload/v1787806687/pixel-art-style-floral-garden-illustration_23-2151503920_1.jpg') center/cover fixed no-repeat;
    background-color: var(--bg-main);
    color: var(--text-main);
    overflow-x: hidden;
  }

  body.setup-bg {
    background:
      linear-gradient(rgba(10, 10, 14, 0.55), rgba(10, 10, 14, 0.78)),
      url('https://res.cloudinary.com/uzfgyrxf/image/upload/v1787806687/pixel-art-style-floral-garden-illustration_23-2151503920_1.jpg') center/cover fixed no-repeat;
  }

  body.welcome-bg {
    background:
      linear-gradient(rgba(10, 10, 14, 0.35), rgba(10, 10, 14, 0.55)),
      url('https://res.cloudinary.com/uzfgyrxf/image/upload/v1787807028/file_00000000e9448211b6d1eeef8edc2c67.png') center/cover fixed no-repeat;
  }
  
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px);
    background: #22222c; border: 1px solid #383848; color: #FFF; padding: 12px 16px;
    border-radius: 12px; font-size: 14px; display: flex; align-items: center; gap: 14px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4); z-index: 10001; opacity: 0; pointer-events: none;
    transition: all 0.25s ease; max-width: 90vw;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
  .toast button { background: none; border: none; color: var(--accent); font-weight: 700; cursor: pointer; font-size: 14px; font-family: 'Inter', sans-serif; }

  .pixel-petal {
    position: fixed;
    top: -15px;
    z-index: 1;
    pointer-events: none;
    user-select: none;
    width: 6px;
    height: 6px;
    image-rendering: pixelated;
    animation: pixelFall linear infinite;
  }
  @keyframes pixelFall {
    0% { transform: translateY(0) rotate(0deg) translateX(0); opacity: 0.85; }
    50% { transform: translateY(50vh) rotate(180deg) translateX(12px); opacity: 0.7; }
    100% { transform: translateY(105vh) rotate(360deg) translateX(-12px); opacity: 0; }
  }

  @keyframes popIn {
    0% { transform: scale(0.8); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  .imposter-icon {
    cursor: pointer;
    transition: filter 0.2s ease;
  }
  .imposter-icon:hover {
    filter: drop-shadow(0 2px 5px rgba(255,69,58,0.8)) brightness(1.15);
  }
  .imposter-icon.fleeing { pointer-events: none; }

  @keyframes impactSquish {
    0% { transform: scale(1); }
    25% { transform: scale(1.12, 0.86) rotate(-1.5deg); }
    55% { transform: scale(0.92, 1.08) rotate(1.5deg); }
    80% { transform: scale(1.04, 0.98); }
    100% { transform: scale(1); }
  }
  .start-btn.imposter-hit { animation: impactSquish 0.45s ease; }

  .poof-particle {
    position: fixed; pointer-events: none; z-index: 9998; will-change: transform, opacity;
    transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.3, 1), opacity 0.6s ease-out;
  }

  .watermark {
    position: fixed; bottom: 8px; right: 12px; font-size: 10px; color: var(--text-muted); opacity: 0.5; z-index: 9999; pointer-events: none; letter-spacing: 0.5px;
  }

  .app-container {
    width: 100%; max-width: var(--max-w); margin: 0 auto; min-height: 100vh; padding: 20px 16px 100px; 
    display: flex; flex-direction: column; position: relative; z-index: 2;
  }

  .welcome-container { padding: 0 !important; max-width: 100% !important; width: 100vw !important; }

  @media (min-width: 768px) {
    :root { --max-w: 620px; }
    .app-container { padding: 36px 24px 120px; }
    .card { padding: 20px; }
    h1 { font-size: 28px !important; }
    .subtitle { font-size: 15px !important; }
    .hero-image { width: 260px !important; height: 260px !important; }
  }
  @media (min-width: 1200px) { :root { --max-w: 680px; } }

  h1 { font-size: 24px; font-weight: 700; text-align: center; margin: 10px 0 4px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
  .subtitle { text-align: center; color: var(--text-muted); font-size: 14px; margin-bottom: 24px; text-shadow: 0 1px 3px rgba(0,0,0,0.5); }
  
  .card {
    background: var(--bg-card); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-radius: var(--radius); padding: 16px; margin-bottom: 16px; border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 8px 32px rgba(0,0,0,0.2);
  }
  .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; font-weight: 600; font-size: 15px; }
  .card-header .count { color: var(--text-muted); font-size: 13px; font-weight: 400; }

  .setup-screen .card {
    position: relative; background: linear-gradient(180deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0.04) 100%), rgba(30, 30, 38, 0.42);
    backdrop-filter: blur(28px) saturate(180%); -webkit-backdrop-filter: blur(28px) saturate(180%);
    border: 1px solid rgba(255,255,255,0.16); box-shadow: 0 1px 0 rgba(255,255,255,0.25) inset, 0 8px 30px rgba(0,0,0,0.35), 0 0 0 1px rgba(0,0,0,0.08); overflow: hidden;
  }
  .setup-screen .card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.55), transparent);
  }
  .setup-screen h1, .setup-screen .subtitle { text-shadow: 0 2px 12px rgba(0,0,0,0.65); }
  .setup-screen .player-input-wrap { background: rgba(255,255,255,0.07); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.10); }
  .setup-screen .player-input-wrap:focus-within { background: rgba(255,255,255,0.11); box-shadow: 0 0 0 1px var(--accent), 0 0 16px rgba(255,159,10,0.25); }
  .setup-screen .chip { background: rgba(255,255,255,0.06); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.10); }
  .setup-screen .chip.active { background: linear-gradient(180deg, rgba(255,159,10,0.55), rgba(204,126,0,0.55)); border: 1px solid rgba(255,200,120,0.55); box-shadow: 0 2px 10px rgba(255,159,10,0.25); }
  .setup-screen .add-player-btn { background: rgba(255,255,255,0.03); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .setup-screen .switch { background: rgba(0,0,0,0.35); backdrop-filter: blur(4px); }
  .setup-screen .bottom-bar { background: rgba(18,18,22,0.55); backdrop-filter: blur(24px) saturate(160%); -webkit-backdrop-filter: blur(24px) saturate(160%); border-top: 1px solid rgba(255,255,255,0.10); }
  .setup-screen .start-btn { background: linear-gradient(180deg, #FFB020, var(--accent)); box-shadow: 0 1px 0 rgba(255,255,255,0.4) inset, 0 6px 18px rgba(255,159,10,0.35); }
  .setup-screen .player-idx { box-shadow: 0 1px 0 rgba(255,255,255,0.3) inset, 0 2px 8px rgba(0,0,0,0.3); }

  .player-list { display: flex; flex-direction: column; gap: 10px; }
  .player-row { display: flex; align-items: center; gap: 12px; }
  .player-idx {
    width: 38px; height: 38px; background: var(--accent-dark); color: #FFF; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; flex-shrink: 0; cursor: pointer; background-size: cover; background-position: center; position: relative; border: 2px solid transparent; transition: all 0.2s ease;
  }
  .player-idx:hover { border-color: var(--accent); transform: scale(1.05); }

  .player-input-wrap {
    flex: 1; background: var(--bg-input); border-radius: var(--radius-sm); padding: 12px 14px; display: flex; align-items: center; transition: all 0.2s ease; border: 1px solid rgba(255,255,255,0.05);
  }
  .player-input-wrap:focus-within { box-shadow: 0 0 0 1px var(--accent); background: rgba(45, 45, 58, 0.95); }
  .player-input-wrap input { background: transparent; border: none; color: var(--text-main); font-size: 15px; width: 100%; outline: none; font-family: 'Inter', sans-serif; }
  .del-btn { background: none; border: none; color: var(--text-muted); padding: 5px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s ease; }
  .del-btn:hover { color: var(--danger); transform: scale(1.15); }
  
  .add-player-btn { width: 100%; background: transparent; border: 1px dashed rgba(255,255,255,0.2); color: var(--text-muted); padding: 12px; border-radius: var(--radius-sm); margin-top: 10px; cursor: pointer; font-size: 15px; font-weight: 500; transition: all 0.2s ease; }
  .add-player-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(255, 159, 10, 0.05); }

  .setting-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer; transition: background 0.2s ease; border-radius: 8px; margin: 0 -8px; padding: 12px 8px; }
  .setting-row:hover { background: rgba(255, 255, 255, 0.05); }
  .setting-row:last-child { border-bottom: none; }
  .setting-info { display: flex; gap: 12px; align-items: center; flex: 1; }
  .setting-icon { color: var(--accent); font-size: 18px; }
  .setting-text h3 { margin: 0; font-size: 15px; font-weight: 500; }
  .setting-text p { margin: 4px 0 0; font-size: 12px; color: var(--text-muted); }
  
  .switch { width: 44px; height: 24px; background: rgba(0,0,0,0.4); border-radius: 12px; position: relative; transition: 0.3s; border: 1px solid rgba(255,255,255,0.1); }
  .switch::after { content: ''; position: absolute; top: 1px; left: 2px; width: 20px; height: 20px; background: #FFF; border-radius: 50%; transition: 0.3s; }
  .switch.active { background: var(--accent); border-color: var(--accent); }
  .switch.active::after { transform: translateX(18px); }

  .bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; padding: 16px; background: rgba(18, 18, 22, 0.85); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: center; z-index: 10; }
  .bottom-bar .inner { width: 100%; max-width: var(--max-w); }
  .start-btn { width: 100%; background: var(--accent); color: #000; font-weight: 600; font-size: 16px; padding: 16px; border: none; border-radius: var(--radius-sm); cursor: pointer; font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.2s ease; }
  .start-btn:hover:not(:disabled) { filter: brightness(1.1); transform: translateY(-2px); box-shadow: 0 4px 15px rgba(255, 159, 10, 0.3); }
  .start-btn:active { opacity: 0.8; transform: scale(0.98); box-shadow: none; }
  .start-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; filter: none; }

  .chip-container { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .chip { background: var(--bg-input); color: var(--text-muted); padding: 8px 14px; border-radius: 20px; font-size: 13px; cursor: pointer; transition: all 0.2s ease; border: 1px solid rgba(255,255,255,0.05); }
  .chip:hover:not(.active) { background: rgba(255,255,255,0.1); color: #FFF; }
  .chip.active { background: var(--accent-dark); color: #FFF; border: 1px solid var(--accent); }

  .admin-box { background: var(--bg-card); padding: 20px; border-radius: var(--radius); margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.08); backdrop-filter: blur(12px);}
  .admin-input { width: 100%; padding: 12px; background: var(--bg-input); border: 1px solid rgba(255,255,255,0.1); color: #FFF; border-radius: 8px; margin-bottom: 10px; font-size: 16px; transition: border-color 0.2s;}
  .admin-input:focus { outline: none; border-color: var(--accent); }
  .admin-btn { background: var(--accent); color: #000; padding: 10px 16px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; transition: all 0.2s ease; }
  .admin-btn:hover:not(:disabled) { filter: brightness(1.1); transform: translateY(-1px); }
  .admin-btn:active:not(:disabled) { transform: scale(0.96); }
  .admin-btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .admin-btn-secondary { background: var(--bg-input); color: #FFF; border: 1px solid #30303C; padding: 10px 16px; border-radius: 8px; cursor: pointer; width: 100%; font-size: 15px; font-weight: 500; transition: all 0.2s ease; }
  .admin-btn-secondary:hover { background: #2a2a36; border-color: var(--text-muted); }
  .admin-btn-secondary:active { transform: scale(0.98); }
  .word-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .word-chip { background: var(--bg-input); padding: 5px 10px; border-radius: 4px; font-size: 12px; display: flex; align-items: center; gap: 5px; transition: background 0.2s; border: 1px solid rgba(255,255,255,0.05); }
  .word-chip:hover { background: rgba(255,255,255,0.1); }
  .word-chip span { transition: transform 0.2s; display: inline-block; }
  .word-chip span:hover { transform: scale(1.2); }

  /* Voice chat widget */
  .voice-card {
    background: linear-gradient(180deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0.02) 100%), var(--bg-card);
    border: 1px solid rgba(255,255,255,0.08); border-radius: var(--radius); padding: 18px; margin-bottom: 16px;
    position: relative; overflow: hidden;
  }
  .voice-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
  }
  .voice-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .voice-status { display: flex; flex-direction: column; gap: 2px; }
  .voice-status-title { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .voice-status-sub { font-size: 12px; color: var(--text-muted); }
  .voice-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-muted); flex-shrink: 0; transition: all 0.25s ease; }
  .voice-dot.live { background: var(--success); box-shadow: 0 0 8px rgba(50,215,75,0.7); animation: voiceDotPulse 1.6s ease-in-out infinite; }
  .voice-dot.connecting { background: var(--accent); box-shadow: 0 0 8px rgba(255,159,10,0.7); animation: voiceDotPulse 0.8s ease-in-out infinite; }
  @keyframes voiceDotPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

  .voice-controls { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .voice-btn {
    width: 52px; height: 52px; border-radius: 50%; border: none; cursor: pointer; position: relative;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    background: var(--bg-input); color: var(--text-muted); border: 1px solid rgba(255,255,255,0.08);
    transition: transform 0.15s ease, background 0.25s ease, color 0.25s ease, box-shadow 0.25s ease;
  }
  .voice-btn:active { transform: scale(0.92); }
  .voice-btn.secondary { width: 44px; height: 44px; }
  .voice-btn.mic-on {
    background: linear-gradient(180deg, #FFB020, var(--accent)); color: #1a1200;
    box-shadow: 0 1px 0 rgba(255,255,255,0.4) inset, 0 4px 16px rgba(255,159,10,0.4);
  }
  .voice-btn.speaker-on { background: linear-gradient(180deg, #3a3a48, #26262f); color: var(--accent); border-color: rgba(255,159,10,0.4); }
  .voice-btn.mic-off-state { background: rgba(255,69,58,0.12); color: var(--danger); border-color: rgba(255,69,58,0.3); }
  .voice-btn .voice-ring {
    position: absolute; inset: -6px; border-radius: 50%; border: 2px solid var(--accent); opacity: 0; pointer-events: none;
  }
  .voice-btn.speaking .voice-ring { animation: voiceRingPulse 1s ease-out infinite; }
  @keyframes voiceRingPulse {
    0% { transform: scale(0.85); opacity: 0.9; }
    100% { transform: scale(1.35); opacity: 0; }
  }
  .voice-btn.loading .voice-spinner { display: block; }
  .voice-spinner {
    display: none; position: absolute; inset: 0; border-radius: 50%;
    border: 2.5px solid rgba(0,0,0,0.15); border-top-color: rgba(0,0,0,0.55);
    animation: voiceSpin 0.7s linear infinite;
  }
  @keyframes voiceSpin { to { transform: rotate(360deg); } }

  .voice-participants { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
  .voice-participant { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 56px; }
  .voice-avatar-ring {
    width: 44px; height: 44px; border-radius: 50%; padding: 3px; display: flex; align-items: center; justify-content: center;
    border: 2px solid transparent; transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .voice-avatar-ring.speaking { border-color: var(--success); box-shadow: 0 0 10px rgba(50,215,75,0.55); }
  .voice-avatar-ring.muted-peer { opacity: 0.45; }
  .voice-participant-name { font-size: 10px; color: var(--text-muted); text-align: center; max-width: 56px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .voice-mini-mute { position: relative; }
  .voice-mini-mute::after {
    content: ''; position: absolute; bottom: -1px; right: -1px; width: 14px; height: 14px; border-radius: 50%;
    background: var(--danger); border: 2px solid var(--bg-main); display: none;
  }
  .voice-mini-mute.is-muted::after { display: block; }

  
  .game-screen { text-align: center; padding-top: 40px; }
  .card-3d-wrap { perspective: 1000px; width: 100%; height: 300px; margin: 30px 0; position: relative; }
  .card-3d { width: 100%; height: 100%; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), top 0.5s ease, opacity 0.5s ease; transform-style: preserve-3d; cursor: pointer; position: absolute; top:0; }
  .card-3d:hover:not(.flipped):not(.discarded) { transform: scale(1.02); }
  .card-3d.flipped { transform: rotateY(180deg); }
  .card-3d.discarded { top: 100%; opacity: 0; pointer-events: none; transform: rotateY(180deg) scale(0.8); }
  .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: var(--radius); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; border: 1px solid rgba(255,255,255,0.1); transition: box-shadow 0.3s ease; backdrop-filter: blur(15px); }
  .card-3d:hover .card-face { box-shadow: 0 8px 25px rgba(0,0,0,0.4); }
  .card-front { background: var(--bg-card); }
  .card-back { background: var(--bg-input); transform: rotateY(180deg); }
  .tap-hint { border: 1px dashed var(--text-muted); color: var(--text-muted); padding: 8px 12px; border-radius: 6px; font-size: 12px; margin-top: 20px; transition: 0.3s; background: rgba(0,0,0,0.3); }

  .vote-option { background: var(--bg-input); border: 2px solid rgba(255,255,255,0.05); padding: 16px; border-radius: var(--radius-sm); margin-bottom: 10px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; font-size: 16px; transition:
